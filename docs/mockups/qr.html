<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 스풀 관리 — 3D Farm Farm 목업</title>
<!--
  QR 스풀 관리 HTML 목업 (v2 TBD-18)
  - 정한 것: 라벨 프린터로 출력 · 폰 카메라로 찍기 · 필라멘트 화면 안 QR 버튼 · 번호 예약(발급 기록) 없이 인쇄만
  - 왼쪽: PC 의 라벨 인쇄 (필라멘트 › QR). 오른쪽: 폰 카메라로 라벨을 찍으면 열리는 폰 화면 (위 버튼으로 찍는 흉내)
  - QR 안에는 주소: {PUBLIC_URL}/s/{코드}. PUBLIC_URL 은 backend/.env (폰과 PC 가 같은 와이파이)
  - 더미 데이터, 오늘은 2026-10-28 로 고정. 스크린샷용: ?scan=S00101 | S00042 | S00031 | S00012 | S00999,  ?theme=dark | light
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
  --text: #1c2026; --muted: #6b7380; --accent: #2f6fed; --accent-soft: #e8efff;
  --good: #1f9254; --warn: #b7791f; --bad: #d64545; --good-soft: #e6f5ec; --warn-soft: #fff6e5; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 10px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #24282e; --border: #30353d;
  --text: #e8eaee; --muted: #9aa2ad; --accent: #6b9bff; --accent-soft: #1f2a44;
  --good: #4cc38a; --warn: #e5b04a; --bad: #ff6b6b; --good-soft: #1b3127; --warn-soft: #3a3020; --bad-soft: #3d2224;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select { font: inherit; color: inherit; }

/* 사이드바 (다른 목업과 같음) */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; --side-w: 220px; transition: grid-template-columns .15s; }
.layout.collapsed { --side-w: 64px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.side-brand .mark { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; text-align: left; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.layout.collapsed .label { display: none; }
.layout.collapsed .nav-item, .layout.collapsed .side-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.mock-tag { font-size: 11px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
.layout.collapsed .mock-tag { display: none; }
main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; }

/* 공통 */
h3, h4 { margin: 0; }
h3 { font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 600; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
input, select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input[type=number], input.num { text-align: right; font-variant-numeric: tabular-nums; }
/* 숫자칸 위 · 아래 버튼 없음 */
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.help { position: relative; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--border); font-size: 10px; font-weight: 700; color: var(--muted); cursor: help; vertical-align: 1px; }
.help:hover, .help:focus { color: var(--accent); border-color: var(--accent); outline: 0; }
.help::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: 280px; padding: 6px 10px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500; line-height: 1.4; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 10; text-align: left; }
.help:hover::after, .help:focus::after { opacity: 1; }
code { padding: 0 4px; border-radius: 4px; background: var(--surface-2); font-size: 12.5px; }

.crumb { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
.page-title { margin: 0 0 14px; font-size: 20px; }

/* 2단: PC 라벨 인쇄 | 폰 화면 */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 14px 16px; }
.panel-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.panel-foot .spacer { flex: 1; }
.where { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: 11.5px; font-weight: 700; }

/* 라벨 인쇄 입력 */
.form-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.with-suffix { display: flex; align-items: center; gap: 6px; }
.with-suffix input { flex: 1; width: 100%; }
.with-suffix em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.field .note { font-size: 12px; color: var(--muted); }
.field .note.warn { color: var(--warn); font-weight: 600; }
.url-line { margin-top: 12px; padding: 9px 12px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.url-line b { color: var(--text); font-family: ui-monospace, Consolas, monospace; font-weight: 600; }

/* 라벨 미리보기: 40×30mm 비율 */
.labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.lbl-card { aspect-ratio: 4 / 3; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; background: #fff; color: #111; border: 1px dashed #c3c8d0; border-radius: 6px; }
.lbl-card svg { width: 64px; height: 64px; display: block; }
.lbl-card .code { font: 700 17px/1.1 ui-monospace, Consolas, monospace; letter-spacing: .5px; }
.lbl-card .brand { font-size: 10px; color: #666; margin-top: 4px; }
.lbl-card.again { border-color: var(--warn); }
.more { display: grid; place-items: center; aspect-ratio: 4 / 3; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin-left: 6px; }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; font-weight: 600; color: var(--muted); cursor: pointer; font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.unreg-line { background: var(--warn-soft); }
.again-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.again-top input[type=search] { flex: 1; min-width: 180px; }
.pick-list { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; max-height: 360px; overflow-y: auto; }
.pick-sec { position: sticky; top: 0; padding: 7px 10px; background: var(--surface-2); font-size: 12.5px; font-weight: 700; border-bottom: 1px solid var(--border); }
.pick-sec .hint { font-weight: 400; font-size: 12px; margin-left: 6px; }
.pick-row { display: grid; grid-template-columns: 20px 70px 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
.pick-row:last-child { border-bottom: 0; }
.pick-row:hover { background: var(--surface-2); }
.pick-row .pc { font-family: ui-monospace, Consolas, monospace; }
.pick-row .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.pick-row .sw.empty { border-style: dashed; background: none; }
.pick-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog > form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; flex: none; }
.dlg-body { padding: 8px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.dlg-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); flex: none; }
.dlg-foot .spacer { flex: 1; }
.log-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.log-row:last-child { border-bottom: 0; }
.log-row .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-row .tag { display: inline-block; padding: 0 7px; margin-right: 4px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-size: 11.5px; font-weight: 700; }
.log-row .tag.new { background: var(--accent-soft); color: var(--accent); }

/* 폰 화면 흉내 */
.scan-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.scan-bar .btn { font-size: 12.5px; padding: 4px 9px; }
.scan-bar .btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.phone { width: 360px; max-width: 100%; margin: 0 auto; border: 10px solid #1b1e23; border-radius: 34px; background: var(--bg); overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.25); }
.phone .bar { height: 26px; display: flex; align-items: center; justify-content: center; background: #1b1e23; color: #9aa2ad; font-size: 11px; }
.phone .addr { padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font: 11.5px ui-monospace, Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phone .scr { min-height: 560px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ph-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ph-top .mark { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 9px; font-weight: 800; }
.ph-code { font: 800 26px/1.1 ui-monospace, Consolas, monospace; letter-spacing: .5px; }
.ph-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
.ph-color { display: flex; align-items: center; gap: 12px; }
.ph-color .sw { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex: none; }
.ph-color .nm { font-weight: 700; font-size: 16px; line-height: 1.3; }
.ph-color .sub { font-size: 12.5px; color: var(--muted); }
.ph-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 12px; font-size: 13px; }
.ph-meta span:nth-child(odd) { color: var(--muted); }
.st { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
.st.sealed { background: var(--surface-2); color: var(--text); }
.st.open { background: var(--accent-soft); color: var(--accent); }
.st.empty { background: var(--surface-2); color: var(--muted); }
.st.new { background: var(--warn-soft); color: var(--warn); }
.big { width: 100%; padding: 15px; font-size: 17px; border-radius: 12px; }
.ph-links { display: flex; justify-content: center; gap: 14px; font-size: 13px; }
.ph-links button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; }
.ph-form { display: flex; flex-direction: column; gap: 10px; }
.ph-form select, .ph-form input { width: 100%; padding: 10px 12px; font-size: 15px; }
.ph-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.same { padding: 12px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); }
.same .t { font-size: 12px; color: var(--accent); font-weight: 700; }
.same .v { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; font-weight: 700; }
.same .v .sw { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
.ph-lbl { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: -6px; }
.ord-line { font-size: 12px; color: var(--muted); margin: -6px 0 10px; }
.ord-line b { color: var(--text); }
.ord-info { padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.same.off { border-color: var(--border); background: var(--surface-2); }
.same.off .t { color: var(--muted); }
.ph-done { padding: 10px 12px; border-radius: 10px; background: var(--good-soft); color: var(--good); font-weight: 700; font-size: 13.5px; }
.ph-err { padding: 14px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.divider { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 100; }
.toast[hidden] { display: none; }

@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  main { padding: 16px; } .layout { --side-w: 64px; } .layout .label { display: none; } .layout .nav-item, .layout .side-brand { justify-content: center; padding-left: 0; padding-right: 0; } .mock-tag, [data-act="toggle-side"] { display: none; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-brand"><span class="mark">3D</span><span class="label">3D Farm Farm</span></div>
    <a class="nav-item" href="products.html" title="제품 원가">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2"/><path d="M12 11v4M10 13h4"/></svg><span class="label">제품 원가</span></a>
    <a class="nav-item active" href="filaments.html" title="필라멘트">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 4v5.5M12 14.5V20"/></svg><span class="label">필라멘트</span></a>
    <a class="nav-item" href="parts.html" title="부자재">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg><span class="label">부자재</span></a>
    <a class="nav-item" href="sales.html" title="판매">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18l-2 12H5z"/><path d="M8 7a4 4 0 0 1 8 0"/><path d="M12 11v5M9.5 13.5h5"/></svg><span class="label">판매</span></a>
    <a class="nav-item" href="expenses.html" title="지출">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span class="label">지출</span></a>
    <a class="nav-item" href="pl.html" title="손익">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="label">손익</span></a>
    <div class="side-bottom">
      <span class="mock-tag">목업 · 더미 데이터</span>
      <a class="nav-item" href="settings.html" title="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="label">설정</span></a>
      <button class="nav-item" data-act="toggle-side" title="사이드바 접기/펼치기" onclick="toggleSide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span class="label">접기</span></button>
    </div>
  </aside>
  <main>
    <div class="crumb"><a href="filaments.html">필라멘트</a> ›</div>
    <h2 class="page-title">QR 스풀 관리</h2>
    <div class="cols">
      <section class="panel" id="print"></section>
      <section id="phone-col"></section>
    </div>
  </main>
</div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const TODAY = "2026-10-28";
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => (n == null ? "-" : Math.round(n).toLocaleString("ko-KR") + "원");

const SPOOLS = {

(() => { const ids = [1, 2, 3, 4, 5, 7, 8, 10, 11]; for (let n = 1; n < 100; n++) { const code = codeOf(n); if (SPOOLS[code] || n === 57 || n === 88) continue;
  const color = ids[n % ids.length], { f, c } = colorById(color), status = n < 40 ? "empty" : n < 75 ? (n % 3 ? "empty" : "open") : n % 4 ? "sealed" : "open";
  SPOOLS[code] = { color, status, price: priceOf(f, c), bought: `2026-${String(5 + Math.floor(n / 20)).padStart(2, "0")}-${String(1 + (n * 7) % 27).padStart(2, "0")}`, opened: status === "sealed" ? null : "2026-10-01", finished: status === "empty" ? "2026-10-10" : null }; } })();

// ---------------------------------------------------------------- 가짜 QR (모양만)
function qrSvg(text) {
  const N = 21; let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((h = (h * 1103515245 + 12345) >>> 0) >>> 16) & 1;
  const fin = (x, y) => { for (const [a, b] of [[0, 0], [N - 7, 0], [0, N - 7]]) { if (x >= a && x < a + 7 && y >= b && y < b + 7) { const i = x - a, j = y - b; return i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4); } } return null; };
  let r = "";
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const f = fin(x, y); if (f === true || (f === null && rnd())) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="-1 -1 ${N + 2} ${N + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${N + 2}" height="${N + 2}" fill="#fff"/><g fill="#111">${r}</g></svg>`;
}

// 인쇄 기록: 버튼을 누르면 창으로
function openLog() {
  const d = $("#dlg");
  $("#dlg-form").innerHTML = `<div class="dlg-head">인쇄 기록<span class="hint" style="font-weight:400">마지막으로 인쇄한 번호 ${codeOf(printState.lastPrinted)}</span></div>
    <div class="dlg-body">${printState.log.map((l) => `<div class="log-row"><span class="when">${esc(l.at.replace(/-/g, "."))}</span>
      <span>${l.again ? `<span class="tag">다시 인쇄</span> ${esc(l.again)}` : `<span class="tag new">새 라벨</span> ${codeOf(l.from)} ~ ${codeOf(l.to)}`}</span>
      <span class="hint">${l.again ? "" : `${l.to - l.from + 1}장`}</span></div>`).join("")}</div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`;
  d.showModal();

function bindPrint() {
  const P = $("#print");
  P.onclick = (e) => {
    if (e.target.closest(".help")) return;
    const m = e.target.closest("[data-mode]"); if (m) { pr.mode = m.dataset.mode; return renderPrint(); }
    if (e.target.closest("[data-show-unreg]")) { Object.assign(pr, { mode: "again", only: "unreg", q: "" }); return renderPrint(); }
    if (e.target.closest("[data-clear]")) { pr.picked.clear(); return renderPrint(); }
    if (e.target.closest("[data-log]")) return openLog();
    if (e.target.closest("#p-go")) {
      const from = pr.from, to = pr.from + pr.count - 1;
      printState.log.unshift({ at: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`, from, to });
      printState.lastPrinted = Math.max(printState.lastPrinted, to);
      pr.from = nextNo(); renderPrint(); renderPhone();
      return toast(`${codeOf(from)} ~ ${codeOf(to)} 인쇄 창을 열었어요 (목업)`);
    }
    if (e.target.closest("#p-again")) {
      const list = [...pr.picked].sort((a, b) => numOf(a) - numOf(b));
      printState.log.unshift({ at: `${TODAY} ${new Date().toTimeString().slice(0, 5)}`, again: list.length > 1 ? `${list[0]} 외 ${list.length - 1}장` : list[0] });
      pr.picked.clear(); renderPrint();
      return toast(`${list.length}장 다시 인쇄 창을 열었어요 (목업) · 번호는 그대로`);
    }
  };
  P.onchange = (e) => {
    const t = e.target;
    if (t.dataset.pick) { t.checked ? pr.picked.add(t.dataset.pick) : pr.picked.delete(t.dataset.pick); return renderPrint(); }
    if (t.id === "p-count") { pr.count = Math.max(1, Math.min(200, Math.round(Number(t.value)) || 1)); return renderPrint(); }
    if (t.id === "p-size") { pr.size = t.value; return renderPrint(); }
    if (t.id === "p-only") { pr.only = t.value; return renderPrint(); }
  };
  const q = $("#p-q");
  if (q) q.oninput = () => { pr.q = q.value; const pos = q.selectionStart; renderPrint(); const n = $("#p-q"); n.focus(); n.setSelectionRange(pos, pos); };
}

function colorLine(colorId, sub) {
  const { f, c } = colorById(colorId);
  return `<div class="ph-color"><span class="sw" style="background:${c.hex}"></span><div><div class="nm">${esc(c.name)}</div><div class="sub">${esc(f.name)}${sub ? ` · ${sub}` : ""}</div></div></div>`;
}

function spoolView(code, sp) {
  const [sl, sc] = STATUS[sp.status];
  const action = { sealed: ["open", "사용 시작"], open: ["empty", "사용 완료"], empty: null }[sp.status];
  const back = { sealed: null, open: ["sealed", "재고로 되돌리기"], empty: ["open", "사용 중으로 되돌리기"] }[sp.status];
  return `<div style="display:flex;align-items:center;gap:10px"><div class="ph-code">${code}</div><span class="st ${sc}">${sl}</span></div>
    <div class="ph-card">${colorLine(sp.color)}
      <div class="ph-meta"><span>구매가</span><span>${won(sp.price)}${sp.order ? ` <span class="hint">· 주문 ${dot(orderOf(sp.order).date)}</span>` : ""}</span><span>구매일</span><span>${dot(sp.bought)}</span>
        ${sp.opened ? `<span>사용 시작</span><span>${dot(sp.opened)}</span>` : ""}${sp.finished ? `<span>사용 완료</span><span>${dot(sp.finished)}</span>` : ""}</div></div>
    ${action ? `<button type="button" class="btn primary big" data-to="${action[0]}">${action[1]}</button><div class="hint" style="text-align:center;margin-top:-6px">오늘(${dot(TODAY)}) 날짜로 기록돼요</div>` : '<div class="hint" style="text-align:center">다 쓴 스풀이에요. 라벨은 떼서 버려도 돼요.</div>'}
    <div class="ph-links">${back ? `<button type="button" data-to="${back[0]}">${back[1]}</button>` : ""}<button type="button" data-edit>정보 고치기</button></div>`;
}

function registerView(code) {
  const st = ph.reg ?? { ...lastReg, fil: colorById(lastReg.color).f.id };
  ph.reg = st;
  const f = FILS.find((x) => x.id === st.fil);
  const os = ordersFor(st.color);
  // 지난번과 같게: 같은 주문에 남은 통이 있어야
  const L = colorById(lastReg.color), lo = orderOf(lastReg.order), lleft = lo ? leftOf(lo, lastReg.color) : null;
  const sameOk = !lo || lleft > 0;
  return `<div style="display:flex;align-items:center;gap:10px"><div class="ph-code">${code}</div><span class="st new">새 라벨</span></div>
    <div class="same ${sameOk ? "" : "off"}"><div class="t">지난번과 같게</div>
      <div class="v"><span class="sw" style="background:${L.c.hex}"></span>${esc(L.f.name.split(" › ")[1] ?? L.f.name)} · ${esc(L.c.name)} · ${won(lastReg.price)}</div>
      <div class="ord-line">${lo ? `주문 ${dot(lo.date)} ${esc(lo.name)} · <b>${lleft}통 남음</b>` : "주문 연결 없음"}</div>
      <button type="button" class="btn primary big" data-reg-same ${sameOk ? "" : "disabled"}>${sameOk ? "이 값으로 등록" : "이 주문은 다 등록했어요"}</button></div>
    <div class="divider">다른 색 · 다른 주문이면</div>
    <div class="ph-form">
      <select data-r="fil" aria-label="필라멘트">${FILS.map((x) => `<option value="${x.id}" ${x.id === st.fil ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
      <select data-r="color" aria-label="색상">${f.colors.map((c) => `<option value="${c.id}" ${c.id === st.color ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <label class="ph-lbl">주문 (지출 장부)</label>
      <select data-r="order" aria-label="주문">${os.map((o) => `<option value="${o.id}" ${o.id === Number(st.order) ? "selected" : ""}>${dot(o.date)} ${esc(o.name)} · ${leftOf(o, st.color)}통 남음 · ${won(lineOf(o, st.color)[2])}</option>`).join("")}
        <option value="" ${st.order ? "" : "selected"}>주문 없이 (구매가 직접 입력)</option></select>
      ${st.order ? `<div class="ord-info">구매가 <b>${won(st.price)}</b> · 구매일 ${dot(st.bought)} <span class="hint">주문에서 (배송비 나눠 넣음)</span></div>`
        : `<div class="row2"><input type="number" data-r="price" value="${st.price ?? ""}" placeholder="구매가" aria-label="구매가"><input type="date" data-r="bought" value="${st.bought}" max="${TODAY}" aria-label="구매일"></div>`}
      <button type="button" class="btn big" data-reg>등록</button>
    </div>`;
}

function onPhoneClick(e) {
  if (e.target.closest(".help")) return;
  const s = e.target.closest("[data-scan]");
  if (s) { ph.code = s.dataset.scan; ph.reg = null; ph.done = null; return renderPhone(); }
  const code = ph.code;
  const to = e.target.closest("[data-to]");
  if (to) {
    const sp = SPOOLS[code], t = to.dataset.to;
    if (t === "open") { sp.opened = TODAY; if (sp.status === "empty") sp.finished = null; }
    if (t === "empty") sp.finished = TODAY;
    if (t === "sealed") sp.opened = null;
    sp.status = t;
    ph.done = { open: "사용 시작으로 바꿨어요", empty: "사용 완료로 바꿨어요", sealed: "재고로 되돌렸어요" }[t];
    return renderPhone();
  }
  if (e.target.closest("[data-edit]")) return toast("정보 고치기: 색상 · 구매가 · 날짜 (목업)");
  const same = e.target.closest("[data-reg-same]"), reg = e.target.closest("[data-reg]");
  if (same || reg) {
    const v = same ? { ...lastReg } : { color: ph.reg.color, order: ph.reg.order ? Number(ph.reg.order) : null, price: Number(ph.reg.price) || null, bought: ph.reg.bought };
    if (v.order) orderOf(v.order).used[v.color] = (orderOf(v.order).used[v.color] || 0) + 1;
    SPOOLS[code] = { color: v.color, status: "sealed", price: v.price, bought: v.bought, opened: null, finished: null, order: v.order };
    lastReg = { ...v };
    const { c } = colorById(v.color);
    ph.reg = null; ph.done = `${code} · ${c.name} 재고로 등록했어요. 다음 라벨을 찍으세요`;
    renderPhone(); renderPrint();
  }
}
function onPhoneChange(e) {
  const k = e.target.dataset.r; if (!k) return;
  // 색상이 바뀌면 그 색상이 남은 최근 주문을 고름 (없으면 직접 입력, 기본값은 원가 계산표 단가)
  const pickOrder = () => { const o = ordersFor(ph.reg.color)[0]; ph.reg.order = o ? o.id : null; if (o) fromOrder(ph.reg); else { const { f, c } = colorById(ph.reg.color); ph.reg.price = priceOf(f, c); ph.reg.bought = TODAY; } };
  if (k === "fil") { ph.reg.fil = Number(e.target.value); const f = FILS.find((x) => x.id === ph.reg.fil); ph.reg.color = f.colors[0].id; pickOrder(); }
  if (k === "color") { ph.reg.color = Number(e.target.value); pickOrder(); }
  if (k === "order") { ph.reg.order = e.target.value ? Number(e.target.value) : null; if (ph.reg.order) fromOrder(ph.reg); else { const { f, c } = colorById(ph.reg.color); ph.reg.price = priceOf(f, c); ph.reg.bought = TODAY; } }
  if (k === "price") ph.reg.price = e.target.value;
  if (k === "bought") ph.reg.bought = e.target.value;
  renderPhone();
}

// ---------------------------------------------------------------- 시작
const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function toggleSide(force) {
  const el = $("#layout");
  const collapsed = force ?? !el.classList.contains("collapsed");
  el.classList.toggle("collapsed", collapsed);
  $("[data-act='toggle-side'] .label").textContent = collapsed ? "펼치기" : "접기";
  try { localStorage.setItem("pff-side-collapsed", collapsed ? "1" : "0"); } catch { /* 저장 불가 */ }
}
let savedSide = null;
try { savedSide = localStorage.getItem("pff-side-collapsed"); } catch { /* 저장 불가 */ }
if (params.get("side") === "collapsed" || savedSide === "1") toggleSide(true);
if (SCANS.some(([c]) => c === params.get("scan"))) ph.code = params.get("scan");
renderPrint();
renderPhone();
</script>
</body>
</html>
