<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 — 3D Farm Farm 목업</title>
<!--
  손익 HTML 목업 (docs/plans/v2.md PL-01 ~ 04 기준)
  - 새로 입력하는 것 없음. 판매 장부 · 지출 장부 · 스풀(구매가 · 사용 시작일)을 기간으로 더하기만 한다.
  - 더미 데이터는 sales.html · expenses.html 과 같은 것 + 지출의 필라멘트 구매에 맞춘 스풀. 오늘은 2026-10-28 로 고정.
  - 스크린샷용: ?basis=cash | pl,  ?period=month | year | all,  ?theme=dark | light
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
  --text: #1c2026; --muted: #6b7380; --accent: #2f6fed; --accent-soft: #e8efff;
  --good: #1f9254; --warn: #b7791f; --bad: #d64545; --good-soft: #e6f5ec; --warn-soft: #fff6e5; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 10px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #24282e; --border: #30353d;
  --text: #e8eaee; --muted: #9aa2ad; --accent: #6b9bff; --accent-soft: #1f2a44;
  --good: #4cc38a; --warn: #e5b04a; --bad: #ff6b6b; --good-soft: #1b3127; --warn-soft: #3a3020; --bad-soft: #3d2224;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select { font: inherit; color: inherit; }

/* 사이드바 (다른 목업과 같음) */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; --side-w: 220px; transition: grid-template-columns .15s; }
.layout.collapsed { --side-w: 64px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.side-brand .mark { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; text-align: left; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.layout.collapsed .label { display: none; }
.layout.collapsed .nav-item, .layout.collapsed .side-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.mock-tag { font-size: 11px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
.layout.collapsed .mock-tag { display: none; }
main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; }
.page-title { margin: 0 0 14px; font-size: 20px; }

/* 공통 */
h3 { margin: 0; font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: default; }
select { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.help { position: relative; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--border); font-size: 10px; font-weight: 700; color: var(--muted); cursor: help; vertical-align: 1px; }
.help:hover, .help:focus { color: var(--accent); border-color: var(--accent); outline: 0; }
.help::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: 280px; padding: 6px 10px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500; line-height: 1.4; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 10; text-align: left; }
.help:hover::after, .help:focus::after { opacity: 1; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* 위쪽 줄: 기간 · 기준 전환 */
.top-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top-row .spacer { flex: 1; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.basis button.on { background: var(--accent); color: #fff; }
.period-nav { display: inline-flex; align-items: center; gap: 4px; }
.picker-wrap { position: relative; }
.period-btn { display: inline-flex; align-items: center; gap: 8px; min-width: 190px; justify-content: center; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-weight: 700; font-size: 15px; cursor: pointer; }
.period-btn:hover, .period-btn.open { border-color: var(--accent); }
.period-btn svg { width: 17px; height: 17px; color: var(--accent); }
.period-btn .chev { font-size: 10px; color: var(--muted); }
.period-btn.open .chev { transform: rotate(180deg); }
.picker { position: absolute; z-index: 20; top: calc(100% + 6px); left: 50%; transform: translateX(-50%); width: 280px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
.picker .py { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
.picker .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.picker .mgrid button { padding: 8px 0; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); font-weight: 600; cursor: pointer; }
.picker .mgrid button:hover:not(:disabled) { border-color: var(--accent); }
.picker .mgrid button.now { border-color: var(--border); }
.picker .mgrid button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.picker .mgrid button:disabled { background: none; color: var(--muted); opacity: .45; cursor: default; }
.picker .pfoot { display: flex; gap: 6px; margin-top: 10px; }
.picker .pfoot .btn { flex: 1; padding: 6px 8px; font-size: 13px; }
.picker .pfoot .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.period-nav .arrow { width: 32px; height: 32px; padding: 0; }

/* 요약 카드 */
.sum-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 4px; }
.sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.sum-card > span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.sum-card strong { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.sum-card strong.pos { color: var(--good); }
.sum-card strong.neg { color: var(--bad); }
.sum-card .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 8px; margin: 8px 0 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }

/* 본문 2단: 계산표 | 그래프 */
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; margin-top: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 18px; }
.panel-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.panel-head .spacer { flex: 1; }

/* 계산표: 단계별 줄. 하위 줄은 들여쓰기 */
.stmt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.stmt td { padding: 6px 0; }
.stmt td.num { width: 130px; }
.stmt tr.sub td { padding: 2px 0; font-size: 12.5px; color: var(--muted); }
.stmt tr.sub td:first-child { padding-left: 18px; }
.stmt tr.total td { border-top: 1px solid var(--border); padding-top: 8px; font-weight: 700; }
.stmt tr.final td { border-top: 2px solid var(--text); padding-top: 9px; font-weight: 800; font-size: 15px; }
.stmt tr.final td.num.pos { color: var(--good); }
.stmt tr.final td.num.neg, .stmt td.num.neg { color: var(--bad); }
.stmt tr.gap td { height: 6px; padding: 0; }
.stmt .op { display: inline-block; width: 14px; color: var(--muted); }
.stmt .pct { margin-left: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.stmt .na { color: var(--muted); font-style: italic; }

/* 두 기준 차이 */
.diff { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; }
.diff h4 { margin: 0 0 4px; font-size: 12.5px; }
.diff .row { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; font-variant-numeric: tabular-nums; }
.diff .row span:first-child { color: var(--muted); }

/* 월별 그래프 */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .grid { stroke: var(--border); }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .in { fill: var(--good); }
.chart .out { fill: var(--muted); opacity: .55; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--accent); }
.chart .dot.neg { fill: var(--bad); }
.chart .val { font-weight: 700; fill: var(--text); }
.chart .val.neg { fill: var(--bad); }
.chart .col { cursor: pointer; }
.chart .col:hover .hit { fill: var(--surface-2); }
.chart .col.sel .hit { fill: var(--accent-soft); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 3px; border-radius: 2px; vertical-align: 3px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 100; }
.toast[hidden] { display: none; }

@media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  main { padding: 16px; } .layout { --side-w: 64px; } .layout .label { display: none; } .layout .nav-item, .layout .side-brand { justify-content: center; padding-left: 0; padding-right: 0; } .mock-tag, [data-act="toggle-side"] { display: none; }
  .sum-cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-brand"><span class="mark">3D</span><span class="label">3D Farm Farm</span></div>
    <a class="nav-item" href="products.html" title="제품 원가">

<script>
"use strict";
const TODAY = "2026-10-28";

// ---------------------------------------------------------------- 더미 데이터 (다른 목업과 같은 기록)
// 판매 (sales.html): [날짜, 판매처, 판매가 합계, 받은 배송비]. 수수료는 스마트스토어만 (판매가 + 배송비) × 4.71%
const SALES = [
  ["2026-06-18", "direct", 13500, 0], ["2026-07-04", "store", 18900, 3000], ["2026-07-11", "store", 12900, 3000],
  ["2026-07-19", "store", 9800, 3000], ["2026-07-26", "store", 31800, 0], ["2026-08-02", "store", 24000, 3000],
  ["2026-08-09", "direct", 40000, 0], ["2026-08-15", "store", 9900, 3000], ["2026-08-22", "store", 37800, 0],
  ["2026-08-30", "store", 17800, 3000], ["2026-09-03", "store", 24000, 3000], ["2026-09-07", "store", 18900, 3000],
  ["2026-09-12", "etc", 85000, 0], ["2026-09-16", "store", 19800, 3000], ["2026-09-21", "store", 25800, 0],
  ["2026-09-28", "store", 14700, 3000], ["2026-10-02", "store", 42900, 0], ["2026-10-06", "store", 18900, 3000],
  ["2026-10-11", "direct", 46500, 0], ["2026-10-14", "store", 9900, 3000], ["2026-10-19", "store", 12900, 3000],
  ["2026-10-23", "store", 42700, 0], ["2026-10-27", "store", 24000, 3000],
].map(([date, ch, gross, ship]) => ({ date, gross, ship, fee: ch === "store" ? Math.round((gross + ship) * 0.0471) : 0 }));

// 지출 (expenses.html): [날짜, 항목, 분류, 금액]
const CATS = { invest: "투자(장비)", filament: "필라멘트", part: "부자재", supply: "소모품 · 유지", sub: "구독 · 운영", sell: "판매비", etc: "기타" };
const EXPENSES = [
  ["2026-05-11", "3D 프린터 (콤보)", "invest", 1090000], ["2026-05-11", "PLA 필라멘트 4롤", "filament", 76000],
  ["2026-05-20", "필라멘트 건조기", "invest", 89000], ["2026-05-20", "클라우드 저장소", "sub", 2900],
  ["2026-06-03", "네오디뮴 자석 200개", "part", 12000], ["2026-06-05", "AI 구독", "sub", 29000],
  ["2026-06-14", "노즐 0.4mm 5개", "supply", 15000], ["2026-06-20", "클라우드 저장소", "sub", 2900],
  ["2026-07-02", "OPP 봉투 500장", "part", 8900], ["2026-07-05", "AI 구독", "sub", 29000],
  ["2026-07-12", "3D 모델링 툴 구독", "sub", 15000], ["2026-07-18", "PETG 필라멘트 2롤", "filament", 42000],
  ["2026-07-20", "클라우드 저장소", "sub", 2900], ["2026-08-05", "AI 구독", "sub", 29000],
  ["2026-08-09", "라벨 프린터", "invest", 59000], ["2026-08-12", "3D 모델링 툴 구독", "sub", 15000],
  ["2026-08-20", "클라우드 저장소", "sub", 2900], ["2026-08-25", "PEI 베드 시트", "supply", 32000],
  ["2026-09-05", "AI 구독", "sub", 29000], ["2026-09-08", "소형 박스 50개", "part", 22000],
  ["2026-09-12", "3D 모델링 툴 구독", "sub", 15000], ["2026-09-15", "검색 광고 충전", "sell", 50000],
  ["2026-09-22", "PLA 필라멘트 6롤", "filament", 108000], ["2026-09-30", "택배비 (9월)", "sell", 31500],
  ["2026-10-05", "AI 구독", "sub", 29000], ["2026-10-10", "전기요금 (9월분)", "sub", 18400],
  ["2026-10-16", "윤활유", "supply", 9800], ["2026-10-21", "도장 제작", "etc", 12000],
].map(([date, name, cat, amount]) => ({ date, name, cat, amount }));

// 스풀 (필라멘트 화면): 지출의 필라멘트 구매에 맞춘 것. [구매가, 사용 시작일(null = 아직 안 뜯음)]
// 5/11 PLA 4롤 76,000 → 19,000 · 7/18 PETG 2롤 42,000 → 21,000 · 9/22 PLA 6롤 108,000 → 18,000
const SPOOLS = [
  [19000, "2026-05-12"], [19000, "2026-06-02"], [19000, "2026-06-25"], [19000, "2026-07-21"],
  [21000, "2026-07-30"], [21000, "2026-08-20"],
  [18000, "2026-09-10"], [18000, "2026-09-26"], [18000, "2026-10-08"], [18000, "2026-10-20"], [18000, null], [18000, null],
].map(([price, opened]) => ({ price, opened }));

// ---------------------------------------------------------------- 유틸
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => (n == null ? "-" : (n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원");
const man = (n) => { const v = Math.round(n / 10000); return (v === 0 ? "0" : (n < 0 ? "−" : "") + Math.abs(v).toLocaleString("ko-KR")) + "만"; };
const help = (tip) => `<span class="help" tabindex="0" data-tip="${esc(tip)}">?</span>`;
const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
const month = (d) => d.slice(0, 7);
const pct = (n, d) => (d ? `${Math.round((n / d) * 100)}%` : "-");
const sign = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200); }

// ---------------------------------------------------------------- 계산 (v2.md "계산 순서")
// 기간 [from, to] (YYYY-MM-DD, 포함) 의 두 기준 계산
function calc(from, to) {
  const inR = (d) => d && d >= from && d <= to;
  const sales = SALES.filter((s) => inR(s.date));
  const exps = EXPENSES.filter((x) => inR(x.date));
  const byCat = (k) => sum(exps.filter((x) => x.cat === k), (x) => x.amount);
  const opened = SPOOLS.filter((s) => inR(s.opened));

  const gross = sum(sales, (s) => s.gross), ship = sum(sales, (s) => s.ship), fee = sum(sales, (s) => s.fee);
  const settle = gross + ship - fee;
  // 손익 기준
  const revenue = gross + ship;
  const spool = sum(opened, (s) => s.price), part = byCat("part");
  const material = spool + part;
  const grossProfit = revenue - material;
  const ops = { fee, sell: byCat("sell"), sub: byCat("sub"), supply: byCat("supply"), etc: byCat("etc") };
  const opsSum = Object.values(ops).reduce((a, v) => a + v, 0);
  const operating = grossProfit - opsSum;
  const tax = 0; // PL-06: 지출 분류에 '세금' 추가 예정
  const net = operating - tax;
  // 현금 기준
  const outAll = sum(exps, (x) => x.amount);
  const cash = settle - outAll;
  return { sales, exps, opened, gross, ship, fee, settle, revenue, spool, part, material, grossProfit, ops, opsSum, operating, tax, net,
    outAll, cash, byCat, invest: byCat("invest"), filBuy: byCat("filament"), qty: sales.length };
}
const FIRST = [...SALES, ...EXPENSES].map((x) => x.date).sort()[0];
const ALL = () => calc("0000-00-00", TODAY);
const lastDay = (m) => `${m}-${String(new Date(Number(m.slice(0, 4)), Number(m.slice(5)), 0).getDate()).padStart(2, "0")}`;
const monthsFrom = (a, b) => { const out = []; let [y, m] = a.split("-").map(Number); const [Y, M] = b.split("-").map(Number); while (y < Y || (y === Y && m <= M)) { out.push(`${y}-${String(m).padStart(2, "0")}`); m++; if (m > 12) { m = 1; y++; } } return out; };
const MONTHS = monthsFrom(month(FIRST), month(TODAY));

// ---------------------------------------------------------------- 화면 상태
const params = new URLSearchParams(location.search);
const state = { basis: params.get("basis") === "cash" ? "cash" : "pl", period: params.get("period") || "month", m: month(TODAY), y: TODAY.slice(0, 4), pick: params.get("pick") === "1", py: TODAY.slice(0, 4) };
const Y0 = FIRST.slice(0, 4), Y1 = TODAY.slice(0, 4);
const range = () => ({
  month: [`${state.m}-01`, lastDay(state.m)],
  year: [`${state.y}-01-01`, `${state.y}-12-31`],
  all: ["0000-00-00", TODAY],
})[state.period];
const periodLabel = () => ({
  month: `${state.m.slice(0, 4)}년 ${Number(state.m.slice(5))}월${state.m === month(TODAY) ? " (진행 중)" : ""}`,
  year: `${state.y}년`,
  all: `전체 (${FIRST.slice(0, 7).replace("-", ".")}~)`,
})[state.period];

// ---------------------------------------------------------------- 그리기
function render() {
  const [from, to] = range();
  const r = calc(from, to);
  const all = ALL();
  const isPL = state.basis === "pl";
  const main = isPL ? r.net : r.cash;
  // 투자 회수 (PL-02): 처음부터 지금까지 손익 기준 순이익 ÷ 누적 투자금
  const rec = all.invest ? all.net / all.invest : 0;
  const canPrev = state.period === "month" ? state.m > MONTHS[0] : state.period === "year" ? state.y > Y0 : false;
  const canNext = state.period === "month" ? state.m < month(TODAY) : state.period === "year" ? state.y < Y1 : false;

  $("#view").innerHTML = `
    <h2 class="page-title">손익</h2>
    <div class="top-row">
      <div class="period-nav">
        <button type="button" class="btn arrow" data-nav="-1" ${canPrev ? "" : "disabled"} aria-label="이전">‹</button>
        <div class="picker-wrap">
          <button type="button" class="period-btn ${state.pick ? "open" : ""}" data-pick aria-expanded="${state.pick}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            ${esc(periodLabel())}<span class="chev">▾</span></button>
          ${state.pick ? picker() : ""}
        </div>
        <button type="button" class="btn arrow" data-nav="1" ${canNext ? "" : "disabled"} aria-label="다음">›</button>
      </div>
      <div class="spacer"></div>
      <div class="seg basis" role="tablist" aria-label="기준">
        <button type="button" data-basis="cash" class="${!isPL ? "on" : ""}">현금 기준</button>
        <button type="button" data-basis="pl" class="${isPL ? "on" : ""}">손익 기준</button>
      </div>
    </div>

    <div class="sum-cards">
      <div class="sum-card"><span>${isPL ? "순이익" : "들어온 돈 − 나간 돈"} · ${esc(periodLabel())}${help(isPL ? "매출 − 재료비 − 운영비 − 세금. 장비는 빠져 있어요" : "판매 정산 금액 − 지출 전부 (장비 포함)")}</span>
        <strong class="${sign(main)}">${won(main)}</strong>
        <span class="sub">${isPL ? `매출 ${won(r.revenue)} · 이익률 ${pct(r.net, r.revenue)}` : `들어온 돈 ${won(r.settle)} · 나간 돈 ${won(r.outAll)}`}</span></div>
      <div class="sum-card"><span>투자 회수${help("처음부터 지금까지 손익 기준 순이익 ÷ 누적 투자금(지출의 투자(장비) 합계). 기간 선택과 상관없이 전체로 계산해요")}</span>
        <strong>${Math.round(rec * 100)}%</strong>
        <div class="meter"><i style="width:${Math.min(100, Math.max(0, rec * 100))}%"></i></div>
        <span class="sub">${won(Math.max(0, all.net))} / ${won(all.invest)}</span></div>
      <div class="sum-card"><span>누적 잔액${help("처음부터 지금까지 현금 기준 합계 (들어온 돈 − 나간 돈). 사업 통장에 남아 있어야 하는 돈")}</span>
        <strong class="${sign(all.cash)}">${won(all.cash)}</strong>
        <span class="sub">들어온 ${won(all.settle)} · 나간 ${won(all.outAll)}</span></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><h3>${isPL ? "손익 계산" : "현금 흐름"}</h3><span class="hint">${esc(periodLabel())}</span></div>
        ${isPL ? plTable(r) : cashTable(r)}
        ${diffBox(r)}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>월별 ${isPL ? "매출 · 비용 · 순이익" : "들어온 돈 · 나간 돈 · 누적 잔액"}</h3><div class="spacer"></div><span class="hint">막대를 누르면 그 달로</span></div>
        ${chart()}
      </div>
    </div>`;
  bind();
}

const line = (label, v, o = {}) => `<tr class="${o.cls || ""}"><td>${o.op ? `<span class="op">${o.op}</span>` : ""}${label}${o.tip ? help(o.tip) : ""}${o.note ? ` <span class="hint">${o.note}</span>` : ""}</td>
  <td class="num ${o.signed ? sign(v) : ""}">${o.na ? `<span class="na">${o.na}</span>` : won(v)}${o.pct != null ? `<span class="pct">${o.pct}</span>` : ""}</td></tr>`;

// 기간 고르기 창: 연도를 넘기고, 달을 누르면 그 달 · '○년 전체' · '처음부터 전체'
function picker() {
  const py = state.py;
  const ms = Array.from({ length: 12 }, (_, i) => `${py}-${String(i + 1).padStart(2, "0")}`);
  const ok = (m) => m >= month(FIRST) && m <= month(TODAY);
  return `<div class="picker" role="dialog" aria-label="기간 고르기">
    <div class="py"><button type="button" class="btn arrow" data-py="-1" ${py > Y0 ? "" : "disabled"} aria-label="이전 해">‹</button><b>${py}년</b><button type="button" class="btn arrow" data-py="1" ${py < Y1 ? "" : "disabled"} aria-label="다음 해">›</button></div>
    <div class="mgrid">${ms.map((m, i) => `<button type="button" data-pm="${m}" class="${state.period === "month" && state.m === m ? "on" : ""} ${m === month(TODAY) ? "now" : ""}" ${ok(m) ? "" : "disabled"}>${i + 1}월</button>`).join("")}</div>
    <div class="pfoot"><button type="button" class="btn ${state.period === "year" && state.y === py ? "on" : ""}" data-pyear>${py}년</button><button type="button" class="btn ${state.period === "all" ? "on" : ""}" data-pall>전체 기간</button></div>
  </div>`;
}

function plTable(r) {
  const gap = '<tr class="gap"><td colspan="2"></td></tr>';
  return `<table class="stmt">
    ${line("매출", r.revenue, { tip: "판매가 합계 + 손님이 낸 배송비 (판매 장부)" })}
    ${line("판매가", r.gross, { cls: "sub" })}
    ${line("받은 배송비", r.ship, { cls: "sub" })}
    ${gap}
    ${line("재료비", r.material, { op: "−", tip: "사용 시작한 스풀의 구매가 + 부자재 지출(산 날). 필라멘트 지출은 여기 안 들어가요 — 대신 뜯은 스풀로" })}
    ${line(`스풀 ${r.opened.length}개 사용 시작`, r.spool, { cls: "sub" })}
    ${line("부자재 지출", r.part, { cls: "sub" })}
    ${line("매출총이익", r.grossProfit, { cls: "total", pct: pct(r.grossProfit, r.revenue), signed: true })}
    ${gap}
    ${line("운영비", r.opsSum, { op: "−", tip: "판매 수수료 + 지출 장부의 판매비 · 구독 · 소모품 · 기타. 투자(장비)는 빼요" })}
    ${line("판매 수수료", r.ops.fee, { cls: "sub" })}
    ${line("판매비 (택배 · 광고)", r.ops.sell, { cls: "sub" })}
    ${line("구독 · 운영", r.ops.sub, { cls: "sub" })}
    ${line("소모품 · 유지", r.ops.supply, { cls: "sub" })}
    ${line("기타", r.ops.etc, { cls: "sub" })}
    ${line("영업이익", r.operating, { cls: "total", pct: pct(r.operating, r.revenue), signed: true })}
    ${gap}
    ${line("세금", r.tax, { op: "−", na: "기록 없음", tip: "종합소득세 등. 지출 분류에 '세금'을 추가해서 기록해요 (PL-06)" })}
    ${line("순이익", r.net, { cls: "final", pct: pct(r.net, r.revenue), signed: true })}
  </table>`;
}

function cashTable(r) {
  const gap = '<tr class="gap"><td colspan="2"></td></tr>';
  const cats = Object.entries(CATS).map(([k, l]) => [l, r.byCat(k)]).filter(([, v]) => v);
  return `<table class="stmt">
    ${line("들어온 돈", r.settle, { tip: "판매 정산 금액 합계 (판매가 + 받은 배송비 − 수수료)" })}
    ${line("판매가 + 받은 배송비", r.revenue, { cls: "sub" })}
    ${line("판매 수수료", -r.fee, { cls: "sub" })}
    ${gap}
    ${line("나간 돈", r.outAll, { op: "−", tip: "지출 장부 전부 (장비 · 필라멘트 포함, 산 날)" })}
    ${cats.map(([l, v]) => line(l, v, { cls: "sub" })).join("") || line("지출 없음", 0, { cls: "sub" })}
    ${line("남은 돈", r.cash, { cls: "final", signed: true })}
  </table>`;
}

// 같은 기간 두 기준이 왜 다른지: 장비 + (필라멘트 산 돈 − 뜯은 스풀)
function diffBox(r) {
  const fil = r.filBuy - r.spool;
  return `<div class="diff"><h4>두 기준 차이 ${help("같은 기간인데 현금 기준과 손익 기준이 다른 이유. 돈이 나간 달과 실제로 쓴 달이 달라서 생겨요")}</h4>
    <div class="row"><span>현금 기준 남은 돈</span><span>${won(r.cash)}</span></div>
    <div class="row"><span>손익 기준 순이익</span><span>${won(r.net)}</span></div>
    <div class="row"><span>· 장비 구매 (손익에서는 투자 회수로)</span><span>${r.invest ? "−" + won(r.invest) : "-"}</span></div>
    <div class="row"><span>· 필라멘트 산 돈 ${won(r.filBuy)} − 뜯은 스풀 ${won(r.spool)}</span><span>${fil ? (fil > 0 ? "−" : "+") + won(Math.abs(fil)) : "-"}</span></div>
  </div>`;
}

// 월별 그래프: 손익 기준 = 매출 · 비용(재료비 + 운영비) 막대 + 순이익 점 / 현금 기준 = 들어온 · 나간 막대 + 누적 잔액 선
function chart() {
  const isPL = state.basis === "pl";
  let acc = 0;
  const rows = MONTHS.map((m) => {
    const c = calc(`${m}-01`, lastDay(m));
    const a = isPL ? c.revenue : c.settle, b = isPL ? c.material + c.opsSum + c.tax : c.outAll, v = isPL ? c.net : c.cash;
    acc += c.cash;
    return { m, a, b, v, acc };
  });
  const W = 640, H = 300, L = 54, R = 10, T = 22, B = 46;
  const vals = rows.flatMap((x) => [x.a, x.b, x.v, isPL ? 0 : x.acc]);
  let max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const step = niceStep((max - min) / 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = (v) => T + ((max - v) / (max - min)) * (H - T - B);
  const cw = (W - L - R) / rows.length, bw = Math.min(22, cw / 3.2);
  const ticks = []; for (let v = min; v <= max + 1; v += step) ticks.push(v);
  const sel = state.period === "month" ? state.m : null;
  const lineKey = isPL ? null : "acc";
  const pts = rows.map((x, i) => [L + cw * i + cw / 2, y(x[lineKey || "v"])]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 그래프">
    ${ticks.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`).join("")}
    <line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
    ${rows.map((x, i) => { const cx = L + cw * i + cw / 2; return `<g class="col ${x.m === sel ? "sel" : ""}" data-month="${x.m}">
      <rect class="hit" x="${L + cw * i + 2}" y="${T - 16}" width="${cw - 4}" height="${H - T - B + 34}" rx="6" fill="transparent"/>
      <rect class="in" x="${cx - bw - 1}" y="${y(x.a)}" width="${bw}" height="${Math.max(0, y(0) - y(x.a))}" rx="3"><title>${isPL ? "매출" : "들어온 돈"} ${won(x.a)}</title></rect>
      <rect class="out" x="${cx + 1}" y="${y(x.b)}" width="${bw}" height="${Math.max(0, y(0) - y(x.b))}" rx="3"><title>${isPL ? "비용" : "나간 돈"} ${won(x.b)}</title></rect>
      <text x="${cx}" y="${H - B + 18}" text-anchor="middle">${Number(x.m.slice(5))}월</text>
      <text class="val ${x.v < 0 ? "neg" : ""}" x="${cx}" y="${H - B + 34}" text-anchor="middle">${man(x.v)}</text></g>`; }).join("")}
    ${isPL ? rows.map((x, i) => `<circle class="dot ${x.v < 0 ? "neg" : ""}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="4"><title>순이익 ${won(x.v)}</title></circle>`).join("")
      : `<polyline class="line" points="${pts.map((p) => p.join(",")).join(" ")}"/>${rows.map((x, i) => `<circle class="dot ${x.acc < 0 ? "neg" : ""}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="3.5"><title>누적 잔액 ${won(x.acc)}</title></circle>`).join("")}`}
  </svg>
  <div class="legend"><span><i style="background:var(--good)"></i>${isPL ? "매출" : "들어온 돈"}</span><span><i style="background:var(--muted);opacity:.55"></i>${isPL ? "비용 (재료비 + 운영비)" : "나간 돈 (장비 포함)"}</span>
    <span><i class="${isPL ? "" : "ln"}" style="background:var(--accent)${isPL ? ";border-radius:50%" : ""}"></i>${isPL ? "순이익 (아래 숫자)" : "누적 잔액 · 아래 숫자는 그 달 남은 돈"}</span></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function bind() {
  $("#view").onclick = (e) => {
    if (e.target.closest(".help")) return;
    const b = e.target.closest("[data-basis]"); if (b) { state.basis = b.dataset.basis; return render(); }
    if (e.target.closest("[data-pick]")) { state.pick = !state.pick; state.py = state.period === "year" ? state.y : state.period === "month" ? state.m.slice(0, 4) : Y1; return render(); }
    const py = e.target.closest("[data-py]"); if (py) { state.py = String(Number(state.py) + Number(py.dataset.py)); return render(); }
    const pm = e.target.closest("[data-pm]"); if (pm) { Object.assign(state, { period: "month", m: pm.dataset.pm, pick: false }); return render(); }
    if (e.target.closest("[data-pyear]")) { Object.assign(state, { period: "year", y: state.py, pick: false }); return render(); }
    if (e.target.closest("[data-pall]")) { Object.assign(state, { period: "all", pick: false }); return render(); }
    if (state.pick && !e.target.closest(".picker")) { state.pick = false; render(); }
    const n = e.target.closest("[data-nav]");
    if (n && !n.disabled) {
      const d = Number(n.dataset.nav);
      if (state.period === "month") { const i = MONTHS.indexOf(state.m) + d; state.m = MONTHS[Math.max(0, Math.min(MONTHS.length - 1, i))]; }
      if (state.period === "year") state.y = String(Number(state.y) + d);
      return render();
    }
    const c = e.target.closest("[data-month]"); if (c) { Object.assign(state, { period: "month", m: c.dataset.month, pick: false }); return render(); }
  };
}

// ---------------------------------------------------------------- 시작
document.documentElement.dataset.theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function toggleSide(force) {
  const el = $("#layout");
  const collapsed = force ?? !el.classList.contains("collapsed");
  el.classList.toggle("collapsed", collapsed);
  $("[data-act='toggle-side'] .label").textContent = collapsed ? "펼치기" : "접기";
  try { localStorage.setItem("pff-side-collapsed", collapsed ? "1" : "0"); } catch { /* 저장 불가 */ }
}
let savedSide = null;
try { savedSide = localStorage.getItem("pff-side-collapsed"); } catch { /* 저장 불가 */ }
if (params.get("side") === "collapsed" || savedSide === "1") toggleSide(true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.pick) { state.pick = false; render(); } });
