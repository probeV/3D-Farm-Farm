<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필라멘트 — 3D Farm Farm 목업</title>
<!--
  필라멘트 탭 HTML 목업 (docs/PRD.md 3.1~3.5, docs/screens.md 기준)
  - 더미 데이터로 동작하며 새로고침하면 초기화된다.
  - 스크린샷용: ?open=manage | manage-material | brand | filament | color | purchase | pick-open | pick-finish | adjust | adjust-detail | tile-menu,  ?only=list
                ?theme=dark | light
  - v1.2.0 TBD-13 시안: ?open=hub | hub-spools — 타일 메뉴의 스풀 조정 · 색상 수정을 버튼 하나(`⚙ 색상 · 스풀 관리`)로, 창 하나에 `색상 정보` · `스풀` 탭
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
  --text: #1c2026; --muted: #6b7380; --accent: #2f6fed; --accent-soft: #e8efff;
  --good: #1f9254; --warn: #b7791f; --bad: #d64545; --warn-soft: #fff6e5; --bad-soft: #fdecec;
  --bar-sealed: #2f6fed; --bar-open: #8fb0f7; --bar-empty: #d5dae2;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 10px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #24282e; --border: #30353d;
  --text: #e8eaee; --muted: #9aa2ad; --accent: #6b9bff; --accent-soft: #1f2a44;
  --good: #4cc38a; --warn: #e5b04a; --bad: #ff6b6b; --warn-soft: #3a3020; --bad-soft: #3d2224;
  --bar-sealed: #6b9bff; --bar-open: #3c5a99; --bar-empty: #3a3f47;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

/* 상단 */
/* 사이드바: 접으면 아이콘만, 펼치면 이름까지 */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; --side-w: 220px; transition: grid-template-columns .15s; }
.layout.collapsed { --side-w: 64px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.side-brand .mark { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; text-align: left; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.layout.collapsed .label, .layout.collapsed .side-brand .label { display: none; }
.layout.collapsed .nav-item, .layout.collapsed .side-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.mock-tag { font-size: 11px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
.layout.collapsed .mock-tag { display: none; }
main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; }
.page-title { margin: 0 0 14px; font-size: 20px; }

/* 공통 */
h2 { margin: 0; font-size: 20px; }
h3 { margin: 0; font-size: 15px; }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
input, select, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input[type=number] { text-align: right; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
/* 전체 요약: 눈에 덜 띄는 한 줄 */
.top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top-row .spacer { flex: 1; }
.list-toolbar { flex-wrap: wrap; }
.list-toolbar input[type=search] { width: 200px; }
.stats { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }
.stats .warn b { color: var(--warn); }
.stats .bad b { color: var(--bad); }
.section-head { display: flex; align-items: center; gap: 12px; margin: 22px 0 10px; }
.section-head .spacer { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* 도구 모음 */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.toolbar input[type=search] { width: 220px; }

/* 회사 로고 */
.logo { width: 28px; height: 28px; border-radius: 8px; flex: none; display: inline-grid; place-items: center; overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: 13px; color: var(--muted); }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.logo.md { width: 48px; height: 48px; border-radius: 12px; font-size: 20px; }
.logo.lg { width: 56px; height: 56px; border-radius: 12px; font-size: 22px; }

/* 회사별 요약 */
/* 회사별 요약: 고정 크기 카드, 최대 2줄, 가로 슬라이드 */
.brand-slider { position: relative; margin: 18px 0 4px; }
.brand-rows { display: flex; flex-direction: column; gap: 12px; overflow-x: auto; scroll-behavior: smooth; padding: 2px; scrollbar-width: none; cursor: grab; }
.brand-rows::-webkit-scrollbar { display: none; }
.brand-rows.dragging { cursor: grabbing; scroll-behavior: auto; user-select: none; }
.brand-row { display: flex; gap: 12px; }
.brand-card > * { flex: none; }
.brand-card .legend { flex-wrap: nowrap; gap: 8px; font-size: 11.5px; white-space: nowrap; }
.brand-card { cursor: pointer; transition: border-color .1s, transform .1s; }
.brand-card:hover { border-color: var(--accent); }
.brand-card .bname { flex: 1; min-width: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.held { text-align: right; line-height: 1.1; flex: none; }
.held b { font-size: 16px; font-variant-numeric: tabular-nums; }
.held b span { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.brand-card { flex: none; width: 260px; height: 124px; scroll-snap-align: start; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.brand-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.brand-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-width: 0; }
.brand-card-head > div { min-width: 0; }
.brand-card-head button { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; font-size: 15px; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.brand-card-head button:hover { color: var(--accent); }
.brand-card-head small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.kg-total strong { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.slide-btn { position: absolute; top: calc(50% - 16px); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-size: 16px; color: var(--muted); z-index: 2; }
.slide-btn:hover { color: var(--accent); border-color: var(--accent); }
.slide-btn.prev { left: -14px; } .slide-btn.next { right: -14px; }
.slide-btn[hidden] { display: none; }
.bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 6px 0 6px; }
.bar span { display: block; height: 100%; }
.bar .s { background: var(--bar-sealed); } .bar .o { background: var(--bar-open); } .bar .e { background: var(--bar-empty); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

/* 필라멘트 목록 */
/* 필라멘트 묶음: 제목 칸도 색상 타일과 같은 크기의 첫 칸. 타일이 여러 줄이 돼도 제목 칸은 그대로 */
.fil-list { display: flex; flex-direction: column; gap: 10px; }
.fil-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.fil-head { flex: none; width: 190px; height: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px; border-radius: 12px; background: var(--accent-soft); border: 0; box-shadow: inset 4px 0 0 var(--accent); min-width: 0; }
.fil-head .logo { margin-bottom: 8px; }
/* TBD-02: 제목 타일을 누르면 그 필라멘트의 수정 창 */
button.fil-head { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.fil-head:hover { border-color: var(--accent); background: var(--accent-soft); }
/* v1.2.0: 마우스를 올리면 이름 옆에 연필 (관리 창 수정 아이콘과 같은 모양) */
.fil-edit { display: none; margin-left: 5px; color: var(--accent); vertical-align: -2px; }
.fil-edit svg { width: 14px; height: 14px; }
button.fil-head:hover .fil-edit { display: inline-block; }
.fil-brand { font-size: 12px; color: var(--muted); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fil-title { font-size: 18px; font-weight: 800; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fil-meta { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.fil-meta.none { color: var(--muted); font-weight: 500; }
.fil-buttons { display: flex; gap: 6px; }
.color-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 64px 64px 64px auto; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.color-row .state { text-align: right; }
.color-name { min-width: 0; max-width: 100%; }
.color-name .cname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.color-actions { flex-wrap: nowrap; }
.color-row:last-child { border-bottom: 0; }
.color-name { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 4px 6px; margin-left: -6px; border-radius: 6px; font-weight: 600; text-align: left; }
.color-name:hover { background: var(--surface-2); }
.color-name small { font-weight: 400; }
.swatch { display: inline-block; width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1px solid var(--border); box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.stock { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.stock-num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stock-num.open { color: var(--accent); }
.stock small { font-size: 11px; color: var(--muted); }
.color-actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.gear { border: 0; background: none; cursor: pointer; padding: 2px 4px; font-size: 18px; line-height: 1; color: var(--muted); }
.gear:hover:not(:disabled) { color: var(--accent); }
.gear:disabled { opacity: .3; cursor: default; }
/* 색상 타일: 왼쪽 색 선 */
.tiles { display: flex; flex-wrap: wrap; gap: 12px; padding: 13px 14px; }
.tile { position: relative; flex: none; width: 190px; height: 150px; display: flex; flex-direction: column; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; overflow: hidden; min-width: 0; transition: border-color .1s, box-shadow .1s; }
/* 색 선: 검정·흰색도 배경에 묻히지 않게 얇은 테두리 */
.tile:not(.add-tile)::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--c); box-shadow: inset -1px 0 0 rgba(128,128,128,.45), inset 0 0 0 1px rgba(128,128,128,.25); }
.tile:hover { border-color: var(--accent); }
.tile.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 12px 2px 18px; min-width: 0; }
.tile-head .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 15px; }
.tile-head .badge { flex: none; font-size: 11px; }
.tile-sub { flex: none; padding: 0 12px 0 18px; min-height: 18px; font-size: 12px; color: var(--muted); }
.tile-kg { flex: none; align-self: flex-end; margin: auto 12px 3px 0; line-height: 1; font-size: 14px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile-kg small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.bar.mini { flex: none; display: flex; align-items: center; height: 11px; margin: 0 12px 0 18px; background: transparent; border-radius: 0; overflow: visible; }
/* 타일 막대: 색이 아니라 모양으로도 구분 (검정·흰색·회색에서도 보이게)
   재고 = 그 색 두꺼운 칸, 사용 중 = 그 색을 연하게 한 두꺼운 칸, 사용 완료 = 가는 선. 칸마다 얇은 테두리 */
.bar.mini .s, .bar.mini .o { height: 100%; box-shadow: inset 0 0 0 1px rgba(128,128,128,.5); border-radius: 3px; }
.bar.mini .s { background: var(--c); }
.bar.mini .o { background: color-mix(in srgb, var(--c) 45%, #a7adb6); }
.bar.mini > span + span { margin-left: 3px; }
.bar.mini .e { height: 2px; background: rgba(128,128,128,.55); }
.tile-counts { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); margin: 8px 12px 10px 18px; }
.tile-counts span { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); line-height: 1.25; }
.tile-counts b { font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.tile-counts .open b { color: var(--accent); }
.tile-counts .muted b { color: var(--muted); }
.add-tile { width: 190px; align-items: center; justify-content: center; gap: 4px; font-size: 12px; border-style: dashed; color: var(--muted); font-weight: 600; background: transparent; }
.add-tile span { font-size: 26px; line-height: 1; }
.add-tile:hover { color: var(--accent); }
.tile-menu { position: absolute; z-index: 50; width: 240px; padding: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 2px; }
/* v1.2.0 TBD-13: 머리 = 색상 칩 · 이름 · 코드 · 상태별 개수, 오른쪽 톱니바퀴(색상 · 스풀 관리) */
.tile-menu-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 6px 4px 10px 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.tile-menu-head .chip { grid-row: span 2; width: 30px; height: 30px; border-radius: 8px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.tile-menu-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-menu-head .meta { grid-column: 2; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile-menu-head .meta code { font-size: 11px; }
.tile-menu-head .gear { grid-row: 1 / span 2; grid-column: 3; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; }
.tile-menu-head .gear:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tile-menu-head .gear svg { width: 17px; height: 17px; }
.tile-menu .act { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; }
.tile-menu .act svg { width: 16px; height: 16px; color: var(--muted); }
.tile-menu .act:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.tile-menu .act:hover:not(:disabled) svg { color: var(--accent); }
.tile-menu .act:disabled { opacity: .4; cursor: default; }
.tile-menu .act small { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.only-list .page-title, .only-list .top-row, .only-list .brand-slider { display: none; }
.only-list .list-toolbar { margin-top: 0; }
.empty { padding: 40px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }

/* 대화상자 */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog.narrow { width: min(380px, calc(100vw - 32px)); }
dialog.wide { width: min(760px, calc(100vw - 32px)); }
.dlg-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-head .title { display: flex; align-items: center; gap: 8px; }
.dlg-body { padding: 16px 20px; overflow-y: auto; max-height: calc(100vh - 150px); }
.dlg-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.dlg-foot .spacer { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .err { color: var(--bad); font-size: 12px; }
.with-suffix { display: flex; align-items: center; gap: 6px; }
.with-suffix input, .with-suffix select { flex: 1; }
.with-suffix em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.view-tabs { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.view-tabs button { border: 0; background: none; cursor: pointer; padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.view-tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

/* 필라멘트 관리 */
.manage { display: grid; grid-template-columns: 240px 1fr; gap: 16px; min-height: 340px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.list-item:hover { background: var(--surface-2); }
.list-item.active { border-color: var(--accent); background: var(--accent-soft); }
.list-item .grow { flex: 1; min-width: 0; }

        price: base ? base - (k % 2) * 1000 : null,
        purchased_at: `2026-${String(8 + (id % 3)).padStart(2, "0")}-${String(1 + (id * 7) % 27).padStart(2, "0")}`,
        opened_at: status !== "sealed" ? `2026-10-${String(1 + (id * 3) % 17).padStart(2, "0")}` : null,
        finished_at: status === "empty" ? `2026-10-${String(2 + (id * 5) % 16).padStart(2, "0")}` : null,
      });
    }
  };
  add("empty", e); add("open", o); add("sealed", s);
});

// ---------------------------------------------------------------- 계산
const byId = (list, id) => list.find((x) => x.id === Number(id));
const brandOf = (f) => byId(db.brands, f.brand);
const materialOf = (f) => byId(db.materials, f.material);
const filamentOf = (c) => byId(db.filaments, c.filament);
const filName = (f) => `${materialOf(f).name}${f.series ? " " + f.series : ""}`;
const filFullName = (f) => `${brandOf(f).name} › ${filName(f)}`;
function colorPrice(c) { const f = byId(db.filaments, c.filament); return c.price ?? f.price; }
const spoolsOf = (c) => db.spools.filter((s) => s.color === c.id);
const count = (list, status) => list.filter((s) => s.status === status).length;
function colorStock(c) { const sp = spoolsOf(c); return { sealed: count(sp, "sealed"), open: count(sp, "open"), empty: count(sp, "empty") }; }
function filamentKg(f) {
  const kg = { sealed: 0, open: 0, empty: 0 };
  db.colors.filter((c) => c.filament === f.id).forEach((c) => {
    const st = colorStock(c);
    for (const k in kg) kg[k] += st[k] * f.spool_g / 1000;
  });
  return kg;
}
function brandKg(b) {
  const kg = { sealed: 0, open: 0, empty: 0 };
  db.filaments.filter((f) => f.brand === b.id).forEach((f) => { const k = filamentKg(f); for (const s in kg) kg[s] += k[s]; });
  return kg;
}
const total = (kg) => kg.sealed + kg.open + kg.empty;
const stockKg = (kg) => kg.sealed + kg.open;
function avgPrice(f) {
  const ids = db.colors.filter((c) => c.filament === f.id).map((c) => c.id);
  const ps = db.spools.filter((s) => ids.includes(s.color) && s.status !== "empty" && s.price != null).map((s) => s.price);
  return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
}

const kgTxt = (n) => (Math.round(n * 10) / 10).toLocaleString("ko-KR");
const swatch = (hex) => `<span class="swatch" style="background:${esc(hex)}"></span>`;
const logo = (b, cls = "") => b.logo ? `<span class="logo ${cls}"><img src="${b.logo}" alt=""></span>` : `<span class="logo ${cls}">${esc(b.name[0])}</span>`;

const ORDER = { sealed: 0, open: 1, empty: 2 };
const HEX_RE = /^#?[0-9a-fA-F]{6}$/;

const state = { q: "", brand: "", material: "", sort: "name" };

function matches(f, c) {
  const q = state.q.trim().toLowerCase();
  if (state.brand && f.brand !== Number(state.brand)) return false;
  if (state.material && f.material !== Number(state.material)) return false;
  if (!q) return true;
  const text = [brandOf(f).name, materialOf(f).name, f.series, c ? c.name : ""].join(" ").toLowerCase();
  return text.includes(q);
}
const sorters = {
  name: (a, b) => a.name.localeCompare(b.name),
  stockDesc: (a, b) => b.stock - a.stock || a.name.localeCompare(b.name),
  stockAsc: (a, b) => a.stock - b.stock || a.name.localeCompare(b.name),
  totalDesc: (a, b) => b.total - a.total || a.name.localeCompare(b.name),
};

// 카드 크기 고정. 한 줄에 다 들어가면 1줄, 넘치면 2줄로 나누고 가로로 슬라이드
const CARD_W = 260, CARD_GAP = 12;
function brandSlider(brands) {
  const width = Math.max(240, $("main").clientWidth - 48);
  const perRow = Math.max(1, Math.floor((width + CARD_GAP) / (CARD_W + CARD_GAP)));
  const rows = brands.length <= perRow ? [brands] : [brands.slice(0, Math.ceil(brands.length / 2)), brands.slice(Math.ceil(brands.length / 2))];
  return `<div class="brand-slider">
    <button type="button" class="slide-btn prev" data-slide="-1" title="이전" hidden>‹</button>
    <div class="brand-rows" id="brand-rows">${rows.map((r) => `<div class="brand-row">${r.map(brandCard).join("")}</div>`).join("")}</div>
    <button type="button" class="slide-btn next" data-slide="1" title="다음" hidden>›</button>
  </div>`;
}

function brandCard(x) {
  const t = total(x.kg) || 1;
  const w = (v) => (v / t * 100).toFixed(1) + "%";
  return `<div class="brand-card ${String(x.b.id) === state.brand ? "active" : ""}" data-act="filter-brand" data-id="${x.b.id}" role="button" tabindex="0" title="필라멘트 목록을 ${esc(x.b.name)}만 보기">

    <div class="bar"><span class="s" style="width:${w(x.kg.sealed)}"></span><span class="o" style="width:${w(x.kg.open)}"></span><span class="e" style="width:${w(x.kg.empty)}"></span></div>
    <div class="legend"><span><i style="background:var(--bar-sealed)"></i>재고 ${kgTxt(x.kg.sealed)}kg</span><span><i style="background:var(--bar-open)"></i>사용 중 ${kgTxt(x.kg.open)}kg</span><span><i style="background:var(--bar-empty)"></i>사용 완료 ${kgTxt(x.kg.empty)}kg</span></div>
  </div>`;
}

function bindSlider() {
  const box = $("#brand-rows");
  if (!box) return;
  const prev = $(".slide-btn.prev"), next = $(".slide-btn.next");
  const update = () => {
    prev.hidden = box.scrollLeft <= 2;
    next.hidden = box.scrollLeft + box.clientWidth >= box.scrollWidth - 2;
  };
  box.onscroll = update;
  update();
  // 마우스로 끌어서 좌우로 넘기기 (끈 경우에는 카드 클릭으로 처리하지 않음)
  let startX = 0, startLeft = 0, moved = false;
  box.onpointerdown = (e) => { if (e.pointerType !== "mouse" || e.button !== 0) return; startX = e.clientX; startLeft = box.scrollLeft; moved = false; box.setPointerCapture(e.pointerId); };
  box.onpointermove = (e) => {
    if (!box.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 4) { moved = true; box.classList.add("dragging"); }
    if (moved) box.scrollLeft = startLeft - dx;
  };
  box.onpointerup = (e) => { if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId); box.classList.remove("dragging"); };
  box.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  // 세로 휠도 좌우로 (넘길 공간이 있을 때만)
  box.onwheel = (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || box.scrollWidth <= box.clientWidth) return;
    const atEdge = (e.deltaY < 0 && box.scrollLeft <= 0) || (e.deltaY > 0 && box.scrollLeft + box.clientWidth >= box.scrollWidth - 1);
    if (atEdge) return;
    e.preventDefault(); box.style.scrollBehavior = "auto"; box.scrollLeft += e.deltaY; box.style.scrollBehavior = "";
  };
}

function show(d, html, cls = "") {
  d.el.className = cls; d.form.innerHTML = html;
  d.form.onclick = d.form.onchange = d.form.oninput = d.form.onsubmit = null;
  if (!d.el.open) d.el.showModal();
}
const close = (d) => d.el.close();
// 확인 대화상자 (common.html TBD-09). 열린 창이 있으면 그 위에 겹쳐 뜬다
// opts: { title, lead, effects: [{ t, d: [html], info }], danger, twice, okLabel, onOk }
const dlg3 = { el: $("#dlg3"), form: $("#dlg3-form") };
function confirmBox(o) {
  const d = !dlg.el.open ? dlg : !dlg2.el.open ? dlg2 : dlg3;
  show(d, `<div class="dlg-head">${esc(o.title)}</div>
    <div class="dlg-body"><p class="lead">${o.lead}</p>
      ${o.effects?.length ? `<div class="effects">${o.effects.map((x) => `<div class="effect ${x.info ? "info" : ""}"><div class="t">${x.t}</div>${(x.d || []).map((y) => `<div class="d">${y}</div>`).join("")}</div>`).join("")}</div>` : ""}
      <div class="again" hidden>한 번 더 누르면 삭제돼요. 되돌릴 수 없어요.</div></div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>
      <button type="button" class="btn ${o.danger ? (o.twice ? "danger-line" : "danger-fill") : "primary"}" data-ok>${esc(o.okLabel || "삭제")}</button></div>`,
    `narrow confirm ${o.effects?.length ? "has-effects" : ""}`);
  d.form.querySelector("[data-close]").focus();
  let armed = !o.twice;
  d.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return close(d);
    const ok = e.target.closest("[data-ok]"); if (!ok) return;
    if (!armed) { armed = true; ok.className = "btn danger-fill"; ok.textContent = "정말 삭제"; d.form.querySelector(".again").hidden = false; return ok.focus(); }
    close(d); o.onOk?.();
  };
}
const foot = (left = "", saveLabel = "저장") => `<div class="dlg-foot">${left}<div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">${saveLabel}</button></div>`;
function onClose(d) { d.form.querySelectorAll("[data-close]").forEach((x) => (x.onclick = () => close(d))); }

// ---------------------------------------------------------------- 필라멘트 관리
let manageBrand = 1;
function openManage(tab) {
  const tabs = `<div class="view-tabs"><button type="button" data-tab="brands" class="${tab === "brands" ? "active" : ""}">회사·필라멘트</button><button type="button" data-tab="materials" class="${tab === "materials" ? "active" : ""}">재질</button></div>`;
  let body;
  if (tab === "brands") {
    const b = byId(db.brands, manageBrand) || db.brands[0];
    const fils = db.filaments.filter((f) => f.brand === b.id);
    body = `<div class="manage">
      <div><div class="col-head"><h4>회사</h4><span class="count">${db.brands.length}</span><div class="spacer"></div><button type="button" class="btn small add" data-add-brand>+ 회사 추가</button></div>
        <div class="col-scroll"><div class="list">${db.brands.map((x) => `<div class="list-item ${x.id === b.id ? "active" : ""}" data-brand="${x.id}">${logo(x)}<div class="grow"><strong>${esc(x.name)}</strong><small>필라멘트 ${db.filaments.filter((f) => f.brand === x.id).length}개</small></div><button type="button" class="icon-btn edit" data-edit-brand="${x.id}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>`).join("")}</div></div></div>
      <div class="manage-right"><div class="col-head"><h4>${esc(b.name)} 의 필라멘트</h4><span class="count">${fils.length}</span><div class="spacer"></div><button type="button" class="btn small add" data-add-fil>+ 필라멘트 추가</button></div>
        <div class="col-scroll">${fils.map((f) => `<div class="row-item fil-row"><div><strong>${esc(filName(f))}</strong><div class="hint">색상 ${db.colors.filter((c) => c.filament === f.id).length}개</div></div><span class="muted">${f.price == null ? "가격 미입력" : `${won(f.price)} / ${f.spool_g}g`}</span><div class="row-btns"><button type="button" class="icon-btn edit" data-copy-fil="${f.id}" title="복제" aria-label="복제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button><button type="button" class="icon-btn edit" data-edit-fil="${f.id}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div></div>`).join("") || '<p class="hint">등록된 필라멘트가 없어요.</p>'}</div></div>
    </div>`;
  } else {
    body = `<div class="col"><div class="col-head"><h4>재질</h4><span class="count">${db.materials.length}</span><div class="spacer"></div><button type="button" class="btn small add" data-add-mat>+ 재질 추가</button></div><div class="col-scroll">${db.materials.map((m) => `<div class="row-item"><strong>${esc(m.name)}</strong><span class="muted">필라멘트 ${db.filaments.filter((f) => f.material === m.id).length}개</span><button type="button" class="icon-btn edit" data-edit-mat="${m.id}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>`).join("")}</div></div>`;
  }
  show(dlg, `<div class="dlg-head"><span class="title">필라멘트 관리</span>${tabs}</div><div class="dlg-body cols">${body}</div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`, "wide fixed");
  onClose(dlg);
  dlg.form.onclick = (e) => {
    const t = e.target;
    if (t.closest("[data-tab]")) return openManage(t.closest("[data-tab]").dataset.tab);
    if (t.closest("[data-edit-brand]")) return openBrand(byId(db.brands, t.closest("[data-edit-brand]").dataset.editBrand));
    if (t.closest("[data-add-brand]")) return openBrand(null);
    if (t.closest("[data-edit-fil]")) return openFilament(byId(db.filaments, t.closest("[data-edit-fil]").dataset.editFil), dlg2);
    if (t.closest("[data-add-fil]")) return openFilament(null, dlg2);
    if (t.closest("[data-copy-fil]")) return openFilament(null, dlg2, byId(db.filaments, t.closest("[data-copy-fil]").dataset.copyFil));
    if (t.closest("[data-del-fil]")) return removeFilament(byId(db.filaments, t.closest("[data-del-fil]").dataset.delFil));
    if (t.closest("[data-edit-mat]")) return openMaterial(byId(db.materials, t.closest("[data-edit-mat]").dataset.editMat));
    if (t.closest("[data-add-mat]")) return openMaterial(null);
    const item = t.closest("[data-brand]");
    if (item) { manageBrand = Number(item.dataset.brand); openManage("brands"); }
  };
}
const refreshManage = (tab) => { render(); if (dlg.el.open && $("#dlg .view-tabs")) openManage(tab); };

function openBrand(b) {
  let logoData = b?.logo || "";
  const preview = () => (logoData ? `<span class="logo lg"><img src="${logoData}" alt=""></span>` : `<span class="logo lg">${esc((b?.name || "?")[0])}</span>`);
  show(dlg2, `<div class="dlg-head">${b ? "회사 수정" : "회사 추가"}</div><div class="dlg-body"><div class="form-grid">
    <label class="field full"><span>회사 이름 *</span><input name="name" required value="${esc(b?.name)}" placeholder="예: Bambu Lab"></label>
    <div class="field full"><span>대표 이미지</span><div class="logo-input"><span id="logo-prev">${preview()}</span>
      <div><input type="file" name="logo" accept="image/png,image/jpeg,image/webp"><div class="hint">png · jpg · webp, 256px 이내로 자동 축소</div>
      <button type="button" class="btn small" data-clear-logo style="margin-top:6px">이미지 지우기</button></div></div></div>
  </div></div>${foot(b ? '<button type="button" class="btn danger" data-del>삭제</button>' : "")}`);
  onClose(dlg2);
  dlg2.form.onchange = (e) => {
    if (e.target.name !== "logo" || !e.target.files[0]) return;
    const r = new FileReader(); r.onload = () => { logoData = r.result; $("#logo-prev").innerHTML = preview(); }; r.readAsDataURL(e.target.files[0]);
  };
  dlg2.form.onclick = (e) => {
    if (e.target.closest("[data-clear-logo]")) { logoData = ""; $("#logo-prev").innerHTML = preview(); }
    if (e.target.closest("[data-del]")) toast(db.filaments.some((f) => f.brand === b.id) ? "필라멘트가 있어서 삭제할 수 없어요" : "삭제했어요");
  };
  dlg2.form.onsubmit = (e) => {
    e.preventDefault(); const fd = new FormData(dlg2.form);
    if (b) Object.assign(b, { name: fd.get("name"), logo: logoData });
    else { const nb = { id: db.brands.length + 1, name: fd.get("name"), logo: logoData }; db.brands.push(nb); manageBrand = nb.id; }
    close(dlg2); toast("저장했어요"); refreshManage("brands");
  };
}

function openMaterial(m) {
  show(dlg2, `<div class="dlg-head">${m ? "재질 수정" : "재질 추가"}</div><div class="dlg-body"><div class="form-grid">
    <label class="field full"><span>재질 이름 *</span><input name="name" required value="${esc(m?.name)}" placeholder="예: PETG-CF"></label></div></div>
    ${foot(m ? '<button type="button" class="btn danger" data-del>삭제</button>' : "")}`, "narrow");
  onClose(dlg2);
  dlg2.form.onclick = (e) => { if (e.target.closest("[data-del]")) toast(db.filaments.some((f) => f.material === m.id) ? "필라멘트에서 쓰고 있어서 삭제할 수 없어요" : "삭제했어요"); };
  dlg2.form.onsubmit = (e) => {
    e.preventDefault(); const name = new FormData(dlg2.form).get("name").trim();
    if (db.materials.some((x) => x.name.toLowerCase() === name.toLowerCase() && x !== m)) return toast("이미 있는 재질이에요");
    if (m) m.name = name; else db.materials.push({ id: db.materials.length + 1, name });
    close(dlg2); toast("저장했어요"); refreshManage("materials");
  };
}

// copyOf: 필라멘트 관리의 `복제` — 값(재질 · 시리즈 · 가격 · 무게)만 복사, 시리즈는 `원래 시리즈 (복사)`. 색상은 복사하지 않음. 저장해야 추가됨
function openFilament(f, d, copyOf) {
  const brandId = f?.brand || copyOf?.brand || manageBrand;
  const v = f || (copyOf && { ...copyOf, series: `${copyOf.series ? copyOf.series + " " : ""}(복사)` });
  show(d, `<div class="dlg-head"><span class="title">${f ? "필라멘트 수정" : `${esc(byId(db.brands, brandId).name)} 필라멘트 추가`}${copyOf ? `<span class="hint" style="font-weight:400">${esc(filName(copyOf))}에서 복제</span>` : ""}</span></div><div class="dlg-body"><div class="form-grid">
    <label class="field"><span>재질 *</span><select name="material" required>${db.materials.map((m) => `<option value="${m.id}" ${m.id === v?.material ? "selected" : ""}>${esc(m.name)}</option>`).join("")}<option value="new">+ 새 재질…</option></select></label>
    <label class="field"><span>시리즈</span><input name="series" value="${esc(v?.series)}" placeholder="예: Matte (없으면 비움)"></label>
    <label class="field"><span>스풀 가격</span><div class="with-suffix"><input type="number" name="price" min="0" step="100" value="${v?.price ?? ""}"><em>원</em></div></label>
    <label class="field"><span>스풀 무게</span><div class="with-suffix"><input type="number" name="spool_g" min="1" step="1" value="${v?.spool_g ?? 1000}"><em>g</em></div></label>
    <div class="field full"><span>표시 이름</span><div id="fil-preview" class="hint"></div></div>
  </div></div>${foot(f ? '<button type="button" class="btn danger" data-del>삭제</button>' : "")}`, d === dlg ? "" : "");
  onClose(d);
  const upd = () => {
    const fd = new FormData(d.form); const m = byId(db.materials, fd.get("material"));
    $("#fil-preview", d.form).textContent = `${byId(db.brands, brandId).name} › ${m ? m.name : "?"}${fd.get("series") ? " " + fd.get("series") : ""}`;
  };
  upd();
  d.form.oninput = upd;
  d.form.onchange = (e) => { if (e.target.name === "material" && e.target.value === "new") { toast("새 재질 입력창이 열려요 (목업)"); e.target.value = db.materials[0].id; } upd(); };
  d.form.onclick = (e) => { if (e.target.closest("[data-del]")) removeFilament(f, () => close(d)); };
  d.form.onsubmit = (e) => {
    e.preventDefault(); const fd = new FormData(d.form);
    const data = { material: Number(fd.get("material")), series: fd.get("series").trim(), price: fd.get("price") ? Number(fd.get("price")) : null, spool_g: Number(fd.get("spool_g")) || 1000 };
    if (f) Object.assign(f, data); else db.filaments.push({ id: db.filaments.length + 1, brand: brandId, ...data });
    close(d); toast("저장했어요"); refreshManage("brands");
  };
}

// 필라멘트 삭제: 색상이 있거나 제품에서 쓰면 서버가 막는다 (FIL-09) → 확인 창 없이 이유만 알림
function removeFilament(f, done) {
  const colors = db.colors.filter((c) => c.filament === f.id).length;
  if (colors) return toast(`색상 ${colors}개가 있어서 삭제할 수 없어요`);
  confirmBox({ title: "필라멘트 삭제", lead: `<b>${esc(filFullName(f))}</b> 필라멘트를 삭제할까요?`, danger: true,
    onOk: () => { db.filaments = db.filaments.filter((x) => x !== f); done?.(); toast("삭제했어요"); refreshManage("brands"); } });
}

// ---------------------------------------------------------------- 색상 추가 / 수정
function openColor(c, preset) {
  // preset: 필라멘트 목록의 "+ 색상" 으로 열면 그 필라멘트로 고정
  const f0 = c ? filamentOf(c) : preset || db.filaments[0];
  const fixed = Boolean(c || preset);
  const brandOpts = (sel) => db.brands.map((b) => `<option value="${b.id}" ${b.id === sel ? "selected" : ""}>${esc(b.name)}</option>`).join("");
  const filOpts = (bid, sel) => db.filaments.filter((f) => f.brand === Number(bid)).map((f) => `<option value="${f.id}" ${f.id === sel ? "selected" : ""}>${esc(filName(f))}</option>`).join("");
  const hex = c?.hex || "#CCCCCC";
  const hero = (hx) => `<span class="chip"></span><div><div class="t">${c ? "색상 수정" : "색상 추가"}${c ? ` · ${esc(c.name)}` : ""}</div><div class="s">${esc(filFullName(f0))}</div></div><code>${hx}</code>`;
  show(dlg, `<div class="color-hero" id="color-hero" style="--c:${hex}">${hero(hex)}</div><div class="dlg-body"><div class="form-grid">
    <label class="field"><span>회사 *</span><select name="brand" ${fixed ? "disabled" : ""}>${brandOpts(f0.brand)}</select></label>
    <label class="field"><span>필라멘트 *</span><select name="filament" ${fixed ? "disabled" : ""}>${filOpts(f0.brand, f0.id)}</select></label>
    <label class="field"><span>색상 이름 *</span><input name="name" required value="${esc(c?.name)}" placeholder="예: 화이트"></label>
    <div class="field"><span>색상 코드 *</span><div class="hex-input">
      <input name="hex" value="${hex}" placeholder="#F5F5F5" autocomplete="off" spellcheck="false">
      <span class="hex-preview" id="hex-prev" style="background:${hex}"></span>
      <input type="color" name="picker" value="${hex.toLowerCase()}" title="색 선택기"></div>
      <span class="hint" id="hex-msg">붙여넣기 예: F5F5F5, #f5f5f5 → #F5F5F5 로 저장</span></div>
    <label class="field"><span>가격</span><div class="with-suffix"><input type="number" name="price" min="0" step="100" value="${c?.price ?? ""}" id="price-in"><em>원</em></div>
      <span class="hint" id="price-hint"></span></label>
  </div></div>${foot(c ? '<button type="button" class="btn danger" data-del>삭제</button>' : "")}`);
  onClose(dlg);
  const form = dlg.form;
  const priceHint = () => {
    const f = byId(db.filaments, form.elements.filament.value) || f0;
    $("#price-hint").textContent = `비우면 필라멘트 가격 ${f.price == null ? "(미입력)" : won(f.price)} 사용`;
    $("#price-in").placeholder = f.price ?? "";
  };
  priceHint();
  const setHero = (hx) => { const h = $("#color-hero"); h.style.setProperty("--c", hx); h.querySelector("code").textContent = hx; };
  form.oninput = (e) => {
    if (e.target.name === "hex") {
      const v = e.target.value.trim(); const ok = HEX_RE.test(v);
      $("#hex-msg").className = ok ? "hint" : "err"; $("#hex-msg").textContent = ok ? `${normHex(v)} 로 저장` : "# 과 16진수 6자리로 입력하세요";
      if (ok) { $("#hex-prev").style.background = normHex(v); form.elements.picker.value = normHex(v).toLowerCase(); setHero(normHex(v)); }
    }
    if (e.target.name === "picker") { form.elements.hex.value = e.target.value.toUpperCase(); $("#hex-prev").style.background = e.target.value; setHero(e.target.value.toUpperCase()); $("#hex-msg").className = "hint"; $("#hex-msg").textContent = `${e.target.value.toUpperCase()} 로 저장`; }
  };
  form.onchange = (e) => {
    if (e.target.name === "brand") { form.elements.filament.innerHTML = filOpts(e.target.value); priceHint(); }
    if (e.target.name === "filament") priceHint();
  };
  form.onclick = (e) => { if (e.target.closest("[data-del]")) removeColor(c); };
  if (hub.c === c) decorateHub(c, "info");
  form.onsubmit = (e) => {
    e.preventDefault(); const fd = new FormData(form); const v = fd.get("hex").trim();
    if (!HEX_RE.test(v)) return toast("색상 코드를 확인하세요");
    const data = { name: fd.get("name").trim(), hex: normHex(v), price: fd.get("price") ? Number(fd.get("price")) : null };
    if (c) Object.assign(c, data); else db.colors.push({ id: db.colors.length + 1, filament: fixed ? f0.id : Number(fd.get("filament")), ...data });
    close(dlg); toast("저장했어요"); render();
  };
}

// 색상 삭제 (TBD-04 · 08): 스풀도 함께 지워지고, 제품에서 쓰면 그 줄의 색상이 비워진다.
// 함께 바뀌는 것이 있으면 2차 확인, 없으면 한 번 확인. 되돌리기는 없음 (2차 확인으로 충분)
function removeColor(c) {
  const s = colorStock(c), n = s.sealed + s.open + s.empty;
  const prods = COLOR_USED_BY[c.id] || [];
  const effects = [];
  if (n) effects.push({ t: `스풀 ${n}개도 함께 삭제`, d: [`재고 ${s.sealed} · 사용 중 ${s.open} · 사용 완료 ${s.empty}`, "삭제한 스풀은 되돌릴 수 없어요."] });
  if (prods.length) effects.push({ t: `제품 ${prods.length}개의 색상이 비워짐`, info: true, d: [esc(prods.join(" · ")),
    "'색상 선택 안 함'으로 바뀌고 필라멘트 가격으로 계산돼요." + (c.price != null ? " 색상 가격이 따로 있어서 원가가 바뀌어요." : "")] });
  confirmBox({ title: "색상 삭제", lead: `<b>${esc(filFullName(filamentOf(c)))} · ${esc(c.name)}</b> 색상을 삭제할까요?`, danger: true, twice: effects.length > 0, effects,
    onOk: () => { db.spools = db.spools.filter((x) => x.color !== c.id); db.colors = db.colors.filter((x) => x !== c); close(dlg); render();
      toast(n ? `${c.name} 색상과 스풀 ${n}개를 삭제했어요` : `${c.name} 색상을 삭제했어요`); } });
}

// ---------------------------------------------------------------- 재고 추가
function openPurchase(c) {
  const f = filamentOf(c);
  show(dlg, `<div class="dlg-head"><span class="title">${swatch(c.hex)} ${esc(filFullName(f))} · ${esc(c.name)} 재고 추가</span></div><div class="dlg-body"><div class="form-grid">
    <label class="field"><span>수량</span><div class="with-suffix"><input type="number" name="qty" min="1" max="100" value="1"><em>개</em></div></label>
    <label class="field"><span>구매일</span><input type="date" name="date" value="2026-10-19"></label>
    <label class="field full"><span>스풀 1개 구매가</span><div class="with-suffix"><input type="number" name="price" min="0" step="100" value="${colorPrice(c) ?? ""}"><em>원</em></div>
      <span class="hint">기본값은 ${c.price != null ? "색상" : "필라멘트"} 가격이에요. 할인받았다면 실제 가격을 입력하세요.</span></label>
  </div></div>${foot("", "재고에 추가")}`);
  onClose(dlg);
  dlg.form.onsubmit = (e) => {
    e.preventDefault(); const fd = new FormData(dlg.form); const qty = Math.max(1, Math.min(100, Number(fd.get("qty")) || 1)); const codes = [];
    for (let i = 0; i < qty; i++) { const id = db.spools.length + 1; const code = "S" + String(id).padStart(5, "0"); codes.push(code);
      db.spools.push({ id, color: c.id, code, status: "sealed", price: fd.get("price") ? Number(fd.get("price")) : null, purchased_at: fd.get("date"), opened_at: null, finished_at: null }); }
    close(dlg); render(); toast(`${qty}개 추가했어요 (${codes[0]}${qty > 1 ? " ~ " + codes.at(-1) : ""})`, true);
  };
}

// ---------------------------------------------------------------- 스풀 선택 · 조정
const PAGE = 10, GROUP = 5;
function pager(page, totalPages) {
  if (totalPages <= 1) return "";
  const start = Math.floor((page - 1) / GROUP) * GROUP + 1, end = Math.min(start + GROUP - 1, totalPages);
  const b = (t, p, dis, act) => `<button type="button" class="page-btn ${act ? "active" : ""}" data-page="${p}" ${dis ? "disabled" : ""}>${t}</button>`;
  let nums = ""; for (let p = start; p <= end; p++) nums += b(p, p, false, p === page);
  return `<div class="pager">${b("«", Math.max(1, start - GROUP), start === 1)}${b("‹", page - 1, page === 1)}${nums}${b("›", page + 1, page === totalPages)}${b("»", end + 1, end === totalPages)}</div>`;
}
const setStatus = (s, to) => {
  s.status = to;
  if (to === "sealed") { s.opened_at = null; s.finished_at = null; }
  if (to === "open") { s.opened_at ||= "2026-10-19"; s.finished_at = null; }
  if (to === "empty") { s.opened_at ||= "2026-10-19"; s.finished_at = "2026-10-19"; }
};

function openPicker(c, mode, page = 1) {
  const from = mode === "open" ? "sealed" : "open", to = mode === "open" ? "open" : "empty";
  const list = spoolsOf(c).filter((s) => s.status === from).sort((a, b) => a.id - b.id);
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); page = Math.min(page, pages);
  const rows = list.slice((page - 1) * PAGE, page * PAGE);
  show(dlg, `<div class="dlg-head"><span class="title">${swatch(c.hex)} ${esc(c.name)} · ${mode === "open" ? "사용 시작할" : "사용 완료할"} 스풀 선택</span></div>
    <div class="dlg-body"><div class="picker-list">${rows.map((s) => `<button type="button" class="pick" data-pick="${s.id}"><span><code>${s.code}</code> <small class="muted">${mode === "open" ? "구매 " + s.purchased_at : "사용 시작 " + s.opened_at}</small></span><strong>${STATUS[to]}</strong></button>`).join("")}</div>${pager(page, pages)}</div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`, "narrow");
  onClose(dlg);
  dlg.form.onclick = (e) => {
    const p = e.target.closest("[data-page]"); if (p && !p.disabled) return openPicker(c, mode, Number(p.dataset.page));
    const k = e.target.closest("[data-pick]"); if (!k) return;
    const s = byId(db.spools, k.dataset.pick); setStatus(s, to); close(dlg); render(); toast(`${c.name} ${s.code} → ${STATUS[to]}`, true);
  };
}

function openAdjust(c, page = 1, view = "simple") {
  const list = spoolsOf(c).sort((a, b) => a.id - b.id);
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); page = Math.min(page, pages);
  const rows = list.slice((page - 1) * PAGE, page * PAGE);
  const price = (s) => `<div class="with-suffix price-cell"><input type="number" min="0" step="100" data-price="${s.id}" value="${s.price ?? ""}" placeholder="미입력"><em>원</em></div>`;
  const simple = (s) => `<div class="spool-row simple" data-spool="${s.id}"><div class="spool-id"><code>${s.code}</code><small class="muted">${s.purchased_at}</small></div>${price(s)}
    <div class="status-btns">${Object.entries(STATUS).map(([k, v]) => `<button type="button" data-set="${k}" class="${k === s.status ? "current" : ""}" ${k === s.status ? "disabled" : ""}>${v}</button>`).join("")}</div></div>`;
  const detail = (s) => `<div class="spool-row detail" data-spool="${s.id}"><code>${s.code}</code><span class="status-tag s-${s.status}">${STATUS[s.status]}</span>
    <span>${s.purchased_at}</span><span class="d-open">${s.opened_at || "-"}</span><span class="d-empty">${s.finished_at || "-"}</span>${price(s)}<button type="button" class="icon-btn" data-del="${s.id}" title="스풀 기록 삭제">✕</button></div>`;
  const head = view === "simple" ? `<div class="spool-row simple head"><span>스풀 / 구매일</span><span>구매가</span><span>상태</span></div>`
    : `<div class="spool-row detail head"><span>스풀</span><span>상태</span><span>구매일</span><span class="d-open">사용 시작일</span><span class="d-empty">사용 완료일</span><span>구매가</span><span></span></div>`;
  show(dlg, `<div class="dlg-head"><span class="title">${swatch(c.hex)} ${esc(c.name)} · 스풀 조정 <span class="muted" style="font-weight:400">(${list.length}개)</span></span>
    <div class="view-tabs"><button type="button" data-view="simple" class="${view === "simple" ? "active" : ""}">간단</button><button type="button" data-view="detail" class="${view === "detail" ? "active" : ""}">세부</button></div></div>
    <div class="dlg-body">${head}<div class="picker-list">${rows.map(view === "simple" ? simple : detail).join("")}</div>${pager(page, pages)}</div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`, "wide");
  onClose(dlg);
  dlg.form.onchange = (e) => { if (e.target.dataset.price) { byId(db.spools, e.target.dataset.price).price = e.target.value ? Number(e.target.value) : null; toast("구매가를 저장했어요"); render(); } };
  dlg.form.onclick = (e) => {
    const p = e.target.closest("[data-page]"); if (p && !p.disabled) return openAdjust(c, Number(p.dataset.page), view);
    const v = e.target.closest("[data-view]"); if (v) return openAdjust(c, page, v.dataset.view);
    const d = e.target.closest("[data-del]");
    if (d) { const s = byId(db.spools, d.dataset.del); if (!confirm(`${c.name} ${s.code} 스풀 기록을 삭제할까요?`)) return; db.spools = db.spools.filter((x) => x !== s); render(); openAdjust(c, page, view); return toast(`${s.code} 삭제했어요`, true); }
    const b = e.target.closest("[data-set]"); if (!b || b.disabled) return;
    const s = byId(db.spools, b.closest("[data-spool]").dataset.spool), to = b.dataset.set;
    if (ORDER[to] < ORDER[s.status] && !confirm(`${c.name} ${s.code}\n${STATUS[s.status]} → ${STATUS[to]}(으)로 되돌릴까요?`)) return;
    setStatus(s, to); render(); openAdjust(c, page, view); toast(`${c.name} ${s.code} → ${STATUS[to]}`, true);
  };
  if (hub.c === c) decorateHub(c, "spools", view);
}

// ---------------------------------------------------------------- TBD-13 시안: 색상 창 하나 (색상 정보 · 스풀 탭)
// 타일 메뉴의 `⚙ 스풀 조정` · `색상 수정` 을 버튼 하나 `⚙ 색상 · 스풀 관리` 로 합친다. 색상 정보 탭으로 열린다. 머리 띠(TBD-14)는 두 탭이 같이 쓴다.
// 색상 정보 탭은 `저장` 으로 저장, 스풀 탭은 지금처럼 바꾸면 바로 저장 (아래 버튼은 `닫기`)
const hub = { c: null };
function openHub(c, tab) {
  hub.c = c;
  if (tab === "info") openColor(c); else openAdjust(c, 1, "simple");
}
function decorateHub(c, tab, view = "simple") {
  const s = colorStock(c), n = s.sealed + s.open + s.empty;
  const tabs = `<div class="hub-tabs"><button type="button" data-hub="info" class="${tab === "info" ? "active" : ""}">색상 정보</button>
    <button type="button" data-hub="spools" class="${tab === "spools" ? "active" : ""}">스풀<small>${n}</small></button><span class="spacer"></span>
    ${tab === "spools" ? `<div class="view-tabs"><button type="button" data-view="simple" class="${view === "simple" ? "active" : ""}">간단</button><button type="button" data-view="detail" class="${view === "detail" ? "active" : ""}">세부</button></div>` : ""}</div>`;
  const hero = `<div class="color-hero" id="color-hero" style="--c:${c.hex}"><span class="chip"></span><div><div class="t">${esc(c.name)}</div><div class="s">${esc(filFullName(filamentOf(c)))}</div></div><code>${c.hex}</code></div>`;
  const form = dlg.form;
  if (tab === "info") {
    $("#color-hero .t", form).textContent = c.name; // 두 탭의 머리를 같게 (창 이름 대신 색상 이름)
    $("#color-hero", form).insertAdjacentHTML("afterend", tabs);
    // 넓어진 창: 입력칸 오른쪽에 이 색상 요약
    const grid = form.querySelector(".dlg-body > .form-grid");
    const f = filamentOf(c), held = spoolsOf(c).filter((x) => x.status !== "empty" && x.price != null);
    const avg = held.length ? held.reduce((a, x) => a + x.price, 0) / held.length : null;
    const used = COLOR_USED_BY[c.id] || [];
    grid.outerHTML = `<div class="hub-info">${grid.outerHTML}<aside class="hub-aside">
      <div><h5>스풀 ${n}개</h5><div class="kv"><span>재고</span><b>${s.sealed}</b></div><div class="kv"><span>사용 중</span><b>${s.open}</b></div><div class="kv"><span>사용 완료</span><b>${s.empty}</b></div>
        <button type="button" class="go" data-hub="spools">스풀 탭에서 보기 →</button></div>
      <div><h5>남은 무게 · 구매가</h5><div class="kv"><span>재고 + 사용 중</span><b>${kgTxt((s.sealed + s.open) * f.spool_g / 1000)}kg</b></div><div class="kv"><span>평균 구매가</span><b>${won(avg)}</b></div></div>
      <div><h5>쓰는 제품 ${used.length}개</h5>${used.length ? `<ul>${used.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : '<span class="muted">없음</span>'}</div>
    </aside></div>`;
  }
  else {
    form.querySelector(".dlg-head").outerHTML = hero + tabs;
    form.querySelector(".dlg-body").insertAdjacentHTML("afterbegin", `<div class="hub-stock"><span>재고<b>${s.sealed}</b></span><span>사용 중<b>${s.open}</b></span><span>사용 완료<b>${s.empty}</b></span></div>`);
  }
  dlg.el.classList.add("hub");
  // 탭 바꾸기 (창은 그대로 두고 내용만). 다른 클릭은 원래 창의 처리로
  const own = form.onclick;
  form.onclick = (e) => {
    const t = e.target.closest("[data-hub]");
    if (t) return t.dataset.hub === "info" ? openColor(c) : openAdjust(c, 1, "simple");
    own?.(e);
  };
}

// ---------------------------------------------------------------- 시작
const params = new URLSearchParams(location.search);
const theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;
// 스크린샷용: ?only=list 이면 요약을 숨기고 필라멘트 목록만
if (params.get("only") === "list") document.body.classList.add("only-list");
// 사이드바 접힘 상태는 브라우저에 기억
function toggleSide(force) {
  const el = $("#layout");
  const collapsed = force ?? !el.classList.contains("collapsed");
  el.classList.toggle("collapsed", collapsed);
  $("[data-act='toggle-side'] .label").textContent = collapsed ? "펼치기" : "접기";
  try { localStorage.setItem("pff-side-collapsed", collapsed ? "1" : "0"); } catch { /* 저장 불가 */ }
  setTimeout(render, 160);
}
let savedSide = null;
try { savedSide = localStorage.getItem("pff-side-collapsed"); } catch { /* 저장 불가 */ }
if (params.get("side") === "collapsed" || savedSide === "1") toggleSide(true);
render();
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (!document.activeElement || document.activeElement.id !== "q") render(); }, 150); });
const white = db.colors[0];
({
  hub: () => openHub(white, "info"),
  "hub-spools": () => openHub(white, "spools"),
  manage: () => openManage("brands"),
  "manage-material": () => openManage("materials"),
  brand: () => { openManage("brands"); openBrand(db.brands[0]); },
  filament: () => { openManage("brands"); openFilament(db.filaments[1], dlg2); },
  color: () => openHub(db.colors[1], "info"),
  purchase: () => openPurchase(white),
  "pick-open": () => openPicker(white, "open"),
  "pick-finish": () => openPicker(white, "finish"),
  adjust: () => openHub(white, "spools"),
  "adjust-detail": () => { hub.c = white; openAdjust(white, 1, "detail"); },
  "tile-menu": () => openTileMenu($(`.tile[data-color="${white.id}"]`), white),
})[params.get("open")]?.();

</script>
