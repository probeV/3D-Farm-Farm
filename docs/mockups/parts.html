<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재고 관리 · 부속품 — 3D Farm Farm 목업</title>
<!--
  부속품 탭 HTML 목업 (docs/PRD.md 3.7, docs/screens.md 3 기준)
  - 더미 데이터로 동작하며 새로고침하면 초기화된다. 부속품 · 제품은 products.html 의 더미 데이터와 같다. v2: 포장재는 포장 탭(packaging.html)으로 나뉨
  - v2: 카드 보기(카테고리별 묶음 + 사진 타일, 기본) / 표 보기. 남은 수량 · 부족 알림 · 조정은 포장 탭과 같음
  - 스크린샷용: ?open=part | part-new | part-unused | manage | adjust,  ?view=table,  ?theme=dark | light
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
  --text: #1c2026; --muted: #6b7380; --accent: #2f6fed; --accent-soft: #e8efff;
  --good: #1f9254; --warn: #b7791f; --bad: #d64545; --good-soft: #e6f5ec; --warn-soft: #fff6e5; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 10px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #24282e; --border: #30353d;
  --text: #e8eaee; --muted: #9aa2ad; --accent: #6b9bff; --accent-soft: #1f2a44;
  --good: #4cc38a; --warn: #e5b04a; --bad: #ff6b6b; --good-soft: #1b3127; --warn-soft: #3a3020; --bad-soft: #3d2224;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

/* 사이드바: 접으면 아이콘만, 펼치면 이름까지 */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; --side-w: 220px; transition: grid-template-columns .15s; }
.layout.collapsed { --side-w: 64px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.side-brand .mark { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; text-align: left; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.layout.collapsed .label { display: none; }
.layout.collapsed .nav-item, .layout.collapsed .side-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.mock-tag { font-size: 11px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
.layout.collapsed .mock-tag { display: none; }
main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; }
.page-title { margin: 0 0 14px; font-size: 20px; }

/* 공통 */
h4 { margin: 0; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
input, select, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input[type=number] { text-align: right; }
textarea { resize: vertical; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }

.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 6px; font-size: 15px; width: 32px; height: 32px; }
.icon-btn:hover { background: var(--surface-2); color: var(--bad); }

/* 요약 카드 (제품 원가 화면과 같은 모양) */
/* 사용 여부 개수: 맨 위 작은 글씨 한 줄 */
.stats { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 4px; }
.top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top-row .spacer { flex: 1; }
.sum-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 4px; padding: 2px; }
.sum-card { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; margin: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; }
.sum-card > span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.sum-card strong { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.sum-card strong small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }
button.sum-card { cursor: pointer; transition: border-color .1s; }
button.sum-card:hover { border-color: var(--accent); }
button.sum-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sum-card.warn strong { color: var(--warn); }
/* 설명 문구는 (?) 에 마우스를 올리면 위로 (아래 숫자를 가리지 않게) */
.help { position: relative; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--border); font-size: 10px; font-weight: 700; color: var(--muted); cursor: help; vertical-align: 1px; }
.help:hover, .help:focus { color: var(--accent); border-color: var(--accent); outline: 0; }
.help::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: 240px; padding: 6px 10px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500; line-height: 1.4; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 10; }
.help:hover::after, .help:focus::after { opacity: 1; }

/* 목록 제목 줄: 제품 원가 화면의 "제품 목록" 줄과 같은 모양 */
.section-head { display: flex; align-items: center; gap: 12px; margin: 22px 0 10px; flex-wrap: wrap; }
.section-head .spacer { flex: 1; }
.section-head h3 { margin: 0; font-size: 15px; }
.section-head input[type=search] { width: 220px; }

/* 부속품 표 */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pname { font-weight: 700; font-size: 14px; }
.unit-price { font-weight: 700; }
.note { max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.used { cursor: help; }
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* 대화상자 */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog.wide { width: min(760px, calc(100vw - 32px)); }
.dlg-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; }
.dlg-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
/* 머리 · 아래는 그대로 두고 본문만 스크롤 (common.html TBD-01) */
dialog > form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-head, .dlg-foot { flex: none; }
dialog.fixed { height: min(640px, calc(100vh - 32px)); }
dialog.fixed > form { height: 100%; max-height: none; }
dialog.narrow { width: min(400px, calc(100vw - 32px)); }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.dlg-foot .spacer { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.with-suffix { display: flex; align-items: center; gap: 6px; }
.with-suffix input, .with-suffix select { flex: 1; }
.with-suffix em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
.qty-unit { display: grid; grid-template-columns: 1fr 76px; gap: 6px; }
.qty-unit input:last-child { text-align: center; }
/* 개당 단가 미리보기: 구매가 ÷ 묶음 수량 */
.unit-preview { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.unit-preview b { font-size: 16px; }
.unit-preview .was { color: var(--muted); font-size: 12px; margin-right: 6px; text-decoration: line-through; }
/* 사용하는 제품: 제품마다 수량과 이 부속품 금액 (가격을 바꾸면 바뀐 금액도) */
.used-head { display: flex; justify-content: space-between; align-items: baseline; }
.used-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.used-row:last-child { border-bottom: 0; }
.used-row .badge { margin-left: 6px; }
.used-row .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
.used-row .amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.used-row .amt .was { color: var(--muted); }
.used-row .amt .up { color: var(--bad); font-weight: 700; } .used-row .amt .down { color: var(--good); font-weight: 700; }
.foot-note { font-size: 12.5px; color: var(--muted); }

/* 부속품 관리: 왼쪽 구매처 목록, 오른쪽 선택한 구매처의 부속품 (제품 관리 창과 같은 모양) */
.manage { display: grid; grid-template-columns: 220px 1fr; gap: 16px; min-height: 340px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.list-item:hover { background: var(--surface-2); }
.list-item.active { border-color: var(--accent); background: var(--accent-soft); }
.list-item .grow { flex: 1; min-width: 0; }
.list-item small { display: block; color: var(--muted); font-size: 12px; }
.list-item.no-shop strong { color: var(--muted); font-weight: 600; }
.manage-right { border-left: 1px solid var(--border); padding-left: 16px; }
.manage-right h4 { margin: 2px 0 10px; font-size: 14px; }
.row-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.row-item:last-of-type { border-bottom: 0; }
.row-item strong { font-size: 14px; }
.row-item .price { text-align: right; font-variant-numeric: tabular-nums; }
/* v1.2.0: 관리 창 줄 오른쪽 아이콘 묶음 (복제 · 수정) — 모든 관리 창이 같은 크기 · 간격. 삭제는 수정 창 왼쪽 아래에서 */
.row-btns { display: flex; align-items: center; gap: 2px; }
/* 관리 창 목록 칸: 제목 줄(제목 · 개수 · 추가 버튼) + 따로 스크롤 (filaments.html 과 같음) */
.col { display: flex; flex-direction: column; min-height: 0; }
.col-head { display: flex; align-items: center; gap: 8px; min-height: 30px; margin-bottom: 8px; }
.col-head h4 { margin: 0; font-size: 14px; }
.col-head .count { font-size: 12px; color: var(--muted); }
.col-head .spacer { flex: 1; }
.col-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px 4px; }
.btn.add { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn.add:hover { background: var(--accent); color: #fff; }
dialog.fixed .dlg-body.cols { display: flex; overflow: hidden; }
dialog.fixed .cols > .manage { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
.view-tabs { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.view-tabs button { white-space: nowrap; border: 0; background: none; cursor: pointer; padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.view-tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

/* TBD-20 구매 링크: 품목 옆 링크 아이콘 (누르면 새 탭, 행 클릭과 겹치지 않게) */
.buy-link { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 6px; color: var(--accent); background: var(--surface); font-size: 11.5px; font-weight: 600; vertical-align: 1px; text-decoration: none; }
.buy-link:hover { border-color: var(--accent); background: var(--accent-soft); }
.buy-link svg { width: 12px; height: 12px; }
.field .err { color: var(--bad); font-size: 12px; }
/* TBD-17 카테고리 배지 */
.cat { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 600; }
.cat.none { color: var(--muted); font-weight: 500; }

/* TBD-23 다른 부속품으로 바꾸기 */
.used-head .btn { margin-left: auto; }
.rep-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.rep-row .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
.rep-row .amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rep-row .amt .was { color: var(--muted); }
.rep-row .amt .up { color: var(--bad); font-weight: 700; } .rep-row .amt .down { color: var(--good); font-weight: 700; }
.rep-row .merge { display: block; color: var(--accent); font-size: 12px; }
.rep-row.off { opacity: .5; }
.notice { margin: 10px 0 0; padding: 9px 12px; border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; font-size: 13px; }

/* 확인 대화상자 (common.html TBD-09) */
.btn.danger-line { color: var(--bad); border-color: var(--bad); }
.btn.danger-line:hover { background: var(--bad-soft); }
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.confirm .dlg-head { border-bottom: 0; padding-bottom: 4px; }
.confirm .dlg-body { padding-top: 4px; }
.confirm .dlg-foot { border-top: 0; padding-top: 4px; }
.confirm .lead { margin: 0; }
dialog.confirm.has-effects { width: min(460px, calc(100vw - 32px)); }
.confirm .effects { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.confirm .effect { padding: 9px 12px; border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 8px 8px 0; }
.confirm .effect.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.confirm .effect.info { border-left-color: var(--accent); background: var(--accent-soft); }
.confirm .effect .t { font-weight: 700; }
.confirm .effect .d { margin-top: 2px; font-size: 13px; }
.confirm .again { margin-top: 10px; color: var(--bad); font-size: 13px; font-weight: 600; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 100; }
.toast[hidden] { display: none; }

@media (max-width: 760px) {
  main { padding: 16px; } .layout { --side-w: 64px; } .layout .label { display: none; } .layout .nav-item, .layout .side-brand { justify-content: center; padding-left: 0; padding-right: 0; } .mock-tag, [data-act="toggle-side"] { display: none; }
  .section-head input[type=search] { width: 100%; }
  .sum-cards, .form-grid { grid-template-columns: 1fr; }
  .manage { grid-template-columns: 1fr; } .manage-right { border-left: 0; padding-left: 0; border-top: 1px solid var(--border); padding-top: 12px; }
}
/* v1.2.0: 관리 창 줄의 수정 · 복제는 아이콘 (마우스를 올리면 파랑) */
.icon-btn.edit { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; }
.icon-btn.edit svg { width: 16px; height: 16px; }
.icon-btn.edit:hover { color: var(--accent); background: var(--surface-2); }

/* v2 부속품 카드: 카테고리별 묶음(왼쪽 위 제목 줄) + 사진 타일 */
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.cat-groups { display: flex; flex-direction: column; gap: 12px; }
.cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
/* 타일은 폭에 맞춰 늘어남: 1440px 화면에서 한 줄 6개 (고정 190px 이면 5개 + 빈자리) */
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; padding: 14px 16px 16px; }
/* 카테고리 제목 띠: 묶음 맨 위, 옅은 바탕 + 왼쪽 파란 막대 + 큰 글씨, 개수는 알약 */
.cat-title { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
.cat-title::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--accent); }
.cat-title h4 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
.cat-title .m { padding: 1px 9px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted); }
.cat-title .m b { color: var(--text); font-variant-numeric: tabular-nums; }
.cat-title .m.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.cat-title .m.warn b { color: var(--warn); }
.cat-title.none::before { background: var(--border); }
.cat-title.none h4 { color: var(--muted); }
.ptile { position: relative; min-width: 0; height: 232px; display: flex; flex-direction: column; padding: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; overflow: hidden; transition: border-color .1s, box-shadow .1s; }
.ptile:hover { border-color: var(--accent); }
.ptile .photo { flex: none; height: 112px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--border); }
.ptile .photo img { width: 100%; height: 100%; object-fit: cover; }
.ptile .photo.none { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.3; }
.ptile .photo.none b { display: block; font-size: 26px; font-weight: 800; opacity: .35; }
.ptile .flag { position: absolute; top: 8px; right: 8px; }
.ptile .flag .badge { box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.ptile .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px 10px; }
.ptile .pn { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ptile .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile .foot { margin-top: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.ptile .left { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.ptile .left small { font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.ptile.low .left { color: var(--warn); } .ptile.out .left { color: var(--bad); }
.ptile .uprice { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ptile .uprice.none { color: var(--warn); }
.ptile .buy-link { position: absolute; top: 8px; left: 0; margin-left: 8px; }
.ptile.add { align-items: center; justify-content: center; gap: 4px; font-size: 12px; border-style: dashed; color: var(--muted); font-weight: 600; background: transparent; }
.ptile.add span { font-size: 26px; line-height: 1; }
.ptile.add:hover { color: var(--accent); }
/* 부속품 창: 사진 */
.photo-field { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; }
.photo-box { width: 120px; height: 120px; border-radius: 10px; border: 1px dashed var(--border); background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.photo-btns { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.photo-btns label.btn { display: inline-block; }
.photo-btns input[type=file] { display: none; }
.stock-now { display: flex; align-items: center; gap: 10px; }
.stock-now b { font-size: 18px; font-variant-numeric: tabular-nums; }
.adj-preview { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.seg label { cursor: pointer; } .seg input { display: none; }
.seg span { display: block; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
@media (max-width: 760px) { .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* v2 재고 관리 탭 (필라멘트 | 부속품 | 포장) — packaging.html 과 같음 */
.stock-tabs { display: flex; gap: 2px; margin: -4px 0 16px; border-bottom: 1px solid var(--border); }
.stock-tabs a { padding: 8px 16px; color: var(--muted); font-weight: 600; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.stock-tabs a:hover { color: var(--text); }
.stock-tabs a.on { color: var(--accent); border-bottom-color: var(--accent); }
</style>

<script>
"use strict";
// ---------------------------------------------------------------- 더미 데이터
// v2 TBD-31: 지출 장부에서 이 부속품을 산 최근 기록 (expenses.html '산 것'). 저장할 때 묶음 가격 · 수량이 이 값으로 바뀜
// 목업용 부속품 사진: 실제 앱은 사진 파일을 올린다 (제품 사진과 같은 방식). 여기서는 간단한 그림으로 대신
const svgPhoto = (bg, body) => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 112"><rect width="190" height="112" fill="${bg}"/>${body}</svg>`);
const PHOTOS = {
  magnet: svgPhoto("#e9edf2", '<ellipse cx="95" cy="66" rx="34" ry="12" fill="#7d8794"/><rect x="61" y="50" width="68" height="16" fill="#9aa4b1"/><ellipse cx="95" cy="50" rx="34" ry="12" fill="#c3cad3"/><ellipse cx="62" cy="80" rx="16" ry="6" fill="#7d8794"/><ellipse cx="62" cy="76" rx="16" ry="6" fill="#c3cad3"/><ellipse cx="132" cy="84" rx="14" ry="5" fill="#7d8794"/><ellipse cx="132" cy="80" rx="14" ry="5" fill="#c3cad3"/>'),
  bolt: svgPhoto("#f2efe9", '<g transform="rotate(-25 95 56)"><rect x="70" y="40" width="22" height="32" rx="3" fill="#8a8f96"/><rect x="92" y="50" width="62" height="12" fill="#b6bbc2"/><path d="M98 50v12M106 50v12M114 50v12M122 50v12M130 50v12M138 50v12M146 50v12" stroke="#8a8f96" stroke-width="2"/></g>'),
  led: svgPhoto("#e8f1ea", '<rect x="48" y="34" width="94" height="46" rx="4" fill="#1f7a4d"/><circle cx="72" cy="57" r="9" fill="#ffe9a8"/><circle cx="72" cy="57" r="14" fill="#ffe9a8" opacity=".35"/><rect x="92" y="48" width="18" height="18" fill="#222"/><rect x="118" y="52" width="24" height="10" fill="#c9ced6"/><path d="M54 40h4M54 74h4M132 40h4" stroke="#d6b45a" stroke-width="3"/>'),
  pad: svgPhoto("#eceae6", '<rect x="40" y="28" width="110" height="60" rx="6" fill="#f8f8f8" stroke="#d5d5d5"/><g fill="#2b2b2b"><circle cx="62" cy="46" r="9"/><circle cx="88" cy="46" r="9"/><circle cx="114" cy="46" r="9"/><circle cx="62" cy="70" r="9"/><circle cx="88" cy="70" r="9"/><circle cx="114" cy="70" r="9"/></g><circle cx="134" cy="58" r="9" fill="#2b2b2b" opacity=".25"/>'),
  ring: svgPhoto("#eef0f5", '<path d="M80 30h30a26 26 0 0 1 0 52H80z" fill="none" stroke="#a8afba" stroke-width="7"/><path d="M80 30v52" stroke="#a8afba" stroke-width="7"/><circle cx="62" cy="56" r="14" fill="none" stroke="#c4c9d2" stroke-width="5"/>'),
};
const LAST_BUY = { 1: { date: "2026-06-03", name: "네오디뮴 자석 6×3mm 200개" } };
const db = {
  // 부속품 카테고리 (TBD-17): 직접 추가 · 수정. 없어도 등록 가능 (미분류). v2: `포장재` 는 포장 탭(packaging.html)으로 나감
  categories: [{ id: 1, name: "부품" }, { id: 3, name: "기타" }], // v2: 접착제 · 사포 같은 소모품은 소모품 탭(consumables.html)
  // 부속품 = 제품에 붙는 것. v2: photo(사진) · stock(남은 수량) · alert(부족 알림 기준) (products.html 더미 데이터 + 구매처 · 비고 · 카테고리 · 구매 링크, 아직 안 쓰는 고무 발 패드)
  // v2: 박스 · 봉투 · 완충재 · 스티커는 포장 탭으로 (포장 세트로 제품 · 판매에 들어감)
  parts: [
    { id: 1, name: "네오디뮴 자석 6×3mm", category: 1, shop: "알리", buy_url: "https://example.com/magnet", price: 12000, pack_qty: 200, unit: "개", note: "N52", photo: PHOTOS.magnet, stock: 1240, alert: 200 },
    { id: 2, name: "M3 볼트 10mm", category: 1, shop: "쿠팡", buy_url: "", price: 5900, pack_qty: 100, unit: "개", note: "", photo: PHOTOS.bolt, stock: 64, alert: 40 },
    { id: 5, name: "USB LED 모듈", category: 1, shop: "알리", buy_url: "", price: 35000, pack_qty: 10, unit: "개", note: "5V 웜화이트", photo: PHOTOS.led, stock: 3, alert: 5 },
    { id: 8, name: "고무 발 패드", category: 1, shop: "다이소", buy_url: "", price: 1000, pack_qty: 24, unit: "개", note: "", photo: PHOTOS.pad, stock: 0, alert: 8 },
    { id: 12, name: "키링 고리 (D링)", category: 1, shop: "알리", buy_url: "", price: 6000, pack_qty: 100, unit: "개", note: "25mm 은색", photo: PHOTOS.ring, stock: 86, alert: 20 },
  ],
  // 제품 (products.html 더미 데이터 중 이 화면에 필요한 것만). parts: [부속품 id, 수량]. 포장은 제품의 기본 포장(포장 세트)으로 따로
  products: [
    { id: 1, name: "분수 원판 세트", status: "on_sale", parts: [[1, 12]] },
    { id: 2, name: "정다면체 전개도 모형", status: "on_sale", parts: [[1, 20]] },
    { id: 3, name: "소마 큐브", status: "on_sale", parts: [] },
    { id: 4, name: "이름 키링", status: "on_sale", parts: [[12, 1]] },
    { id: 5, name: "USB 무드등", status: "on_sale", parts: [[5, 1], [8, 4]] },
    { id: 6, name: "기어 원리 키트", status: "developing", parts: [[2, 8]] },
    { id: 7, name: "하노이 탑", status: "discontinued", parts: [] },
    { id: 8, name: "도형 칠교", status: "developing", parts: [] },
  ],
};
const STATUS = { on_sale: ["판매중", "good"], developing: ["개발중", "info"], discontinued: ["판매중지", ""] };

// ---------------------------------------------------------------- 유틸
const $ = (s, r = document) => r.querySelector(s);
const byId = (list, id) => list.find((x) => x.id === Number(id));
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Number(n).toLocaleString("ko-KR");
const won = (n) => (n == null ? "-" : Math.round(n).toLocaleString("ko-KR") + "원");
// 개당 단가: 10원 미만은 소수 1자리까지 (예: 8.9원 → 8.9원, 17.8원 → 18원)
const unitWon = (n) => (n == null ? "-" : (n < 10 ? Math.round(n * 10) / 10 : Math.round(n)).toLocaleString("ko-KR") + "원");
const unitPrice = (p) => (p.price == null ? null : p.price / (p.pack_qty || 1));
const help = (tip) => `<span class="help" tabindex="0" data-tip="${esc(tip)}">?</span>`;
const statusBadge = (s) => (s === "on_sale" ? "" : `<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`);
// 이 부속품을 쓰는 제품: [{ name, status, qty }]
const usedBy = (part) => db.products.flatMap((p) => p.parts.filter(([id]) => id === part.id).map(([, qty]) => ({ name: p.name, status: p.status, qty })));
const catName = (id) => byId(db.categories, id)?.name ?? "";
const catBadge = (p) => (p.category == null ? '<span class="cat none">미분류</span>' : `<span class="cat">${esc(catName(p.category))}</span>`);
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
// 구매 링크 아이콘: 누르면 새 탭 (행 클릭 = 수정 창과 겹치지 않게 data-link 로 막음)
const buyLink = (p) => (p.buy_url ? `<a class="buy-link" href="${esc(p.buy_url)}" target="_blank" rel="noopener" data-link title="구매 페이지 열기 (새 탭) · ${esc(p.buy_url)}">${LINK_ICON}구매</a>` : "");
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

// ---------------------------------------------------------------- 화면
const state = { q: "", noPriceOnly: false, lowOnly: false, sort: "name", cat: "", view: "card" };
// 남은 수량 상태: 0 이하 = 없음(빨강), 알림 기준 이하 = 부족(주황) — 포장 탭과 같음
const level = (p) => (p.stock <= 0 ? "out" : p.stock <= p.alert ? "low" : "ok");
// 정렬: 필라멘트 · 제품 목록과 같은 "정렬: …" 선택. 가격이 없는 부속품은 단가 정렬에서 맨 뒤로
const byName = (a, b) => a.name.localeCompare(b.name);
const SORTS = [
  ["name", "이름순", byName],
  ["unitDesc", "개당 단가 높은 순", (a, b) => (unitPrice(a) == null) - (unitPrice(b) == null) || (unitPrice(b) ?? 0) - (unitPrice(a) ?? 0) || byName(a, b)],
  ["usedDesc", "사용 제품 많은 순", (a, b) => usedBy(b).length - usedBy(a).length || byName(a, b)],
  ["shop", "구매처순", (a, b) => (a.shop || "￿").localeCompare(b.shop || "￿") || byName(a, b)],
];

// 제품 1개에 드는 부속품비 (가격 미입력은 0원)
const partsCost = (prod) => prod.parts.reduce((a, [id, q]) => a + (unitPrice(byId(db.parts, id)) ?? 0) * q, 0);

function render() {
  const noPrice = db.parts.filter((p) => p.price == null).length;
  const unused = db.parts.filter((p) => !usedBy(p).length).length;
  const low = db.parts.filter((p) => level(p) !== "ok");
  if (!noPrice) state.noPriceOnly = false;
  if (!low.length) state.lowOnly = false;
  const q = state.q.trim().toLowerCase();
  const rows = db.parts
    .filter((p) => (!state.noPriceOnly || p.price == null) && (!state.lowOnly || level(p) !== "ok") && (!state.cat || (state.cat === "none" ? p.category == null : p.category === Number(state.cat)))
      && (!q || [p.name, p.shop, p.note].join(" ").toLowerCase().includes(q)))
    .sort(SORTS.find(([k]) => k === state.sort)[2]);

  $("#view").innerHTML = `
    <h2 class="page-title">재고 관리</h2>
    <nav class="stock-tabs"><a href="filaments.html">필라멘트</a><a class="on" href="parts.html">부속품</a><a href="packaging.html">포장</a><a href="consumables.html">소모품</a></nav>
    <div class="top-row">
      <div class="stats"><span>제품에서 사용<b>${db.parts.length - unused}</b></span><span>안 쓰는 부속품<b>${unused}</b></span></div>
      <div class="spacer"></div>
      <button type="button" class="btn" data-act="replace" title="제품에서 쓰는 부속품을 다른 부속품으로 한 번에 바꿔요">제품의 부속품 바꾸기</button>
      <button type="button" class="btn" data-act="manage">부속품 관리</button>
    </div>
    <div class="sum-cards">
      <div class="sum-card"><span>등록 부속품</span><strong>${db.parts.length}<small>개</small></strong></div>
      <button type="button" class="sum-card ${low.length ? "warn" : ""} ${state.lowOnly ? "active" : ""}" data-act="low">
        <span>부족 · 없음${help(state.lowOnly ? "부족한 부속품만 보는 중 · 다시 누르면 해제" : "남은 수량이 알림 기준 이하 · 누르면 그 부속품만")}</span><strong>${low.length}<small>개</small></strong></button>
      <button type="button" class="sum-card ${noPrice ? "warn" : ""} ${state.noPriceOnly ? "active" : ""}" data-act="no-price">
        <span>가격 미입력${help(state.noPriceOnly ? "가격 미입력 부속품만 보는 중 · 다시 누르면 해제" : "가격이 없으면 제품 원가에 0원으로 계산돼요 · 누르면 그 부속품만 보기")}</span><strong>${noPrice}<small>개</small></strong></button>
    </div>
    <div class="section-head"><h3>부속품 목록</h3><span class="hint">${rows.length}개</span><div class="spacer"></div>
      <input type="search" id="q" placeholder="품목 · 구매처 · 비고 검색" value="${esc(state.q)}">
      <select id="f-cat"><option value="">카테고리: 전체</option>${db.categories.map((c) => `<option value="${c.id}" ${state.cat === String(c.id) ? "selected" : ""}>${esc(c.name)}</option>`).join("")}${db.parts.some((p) => p.category == null) ? `<option value="none" ${state.cat === "none" ? "selected" : ""}>미분류</option>` : ""}</select>
      <select id="f-sort">${SORTS.map(([k, label]) => `<option value="${k}" ${k === state.sort ? "selected" : ""}>정렬: ${label}</option>`).join("")}</select>
      ${state.q || state.noPriceOnly || state.lowOnly || state.cat ? '<button type="button" class="btn small" data-act="clear">필터 지우기</button>' : ""}
      <div class="view-tabs"><button type="button" data-view="card" class="${state.view === "card" ? "active" : ""}">카드</button><button type="button" data-view="table" class="${state.view === "table" ? "active" : ""}">표</button></div>
    </div>
    ${state.view === "card" ? cards(rows) : `<div class="table-wrap">
      ${rows.length ? `<table>
        <thead><tr><th>품목</th><th>카테고리</th><th>회사/구매처</th><th class="num">구매가</th><th class="num">묶음 수량</th><th class="num">개당 단가</th><th class="num">남은 수량</th><th class="num">사용 제품</th><th>비고</th></tr></thead>
        <tbody>${rows.map(row).join("")}</tbody></table>`
      : '<div class="empty">조건에 맞는 부속품이 없어요.</div>'}
    </div>`}`;
  bindView();
}

// 카드 보기: 카테고리별 묶음 (카테고리 순서 → 미분류). 묶음 왼쪽 위에 이름 · 개수 · 부족 수, 아래에 사진 타일 + 추가 타일
function cards(rows) {
  if (!rows.length) return '<div class="table-wrap"><div class="empty">조건에 맞는 부속품이 없어요.</div></div>';
  const groups = [...db.categories.map((c) => ({ key: c.id, name: c.name })), { key: null, name: "미분류" }]
    .map((g) => ({ ...g, items: rows.filter((p) => p.category === g.key) })).filter((g) => g.items.length);
  return `<div class="cat-groups">${groups.map((g) => `<section class="cat-card">
      <div class="cat-title ${g.key == null ? "none" : ""}"><h4>${esc(g.name)}</h4>
        <span class="m">부속품 <b>${db.parts.filter((p) => p.category === g.key).length}</b>개</span>
        ${g.items.some((p) => level(p) !== "ok") ? `<span class="m warn">부족 · 없음 <b>${g.items.filter((p) => level(p) !== "ok").length}</b></span>` : ""}</div>
      <div class="ptiles">
      ${g.items.map(tile).join("")}
      ${state.q || state.lowOnly || state.noPriceOnly ? "" : `<button type="button" class="ptile add" data-add-in="${g.key ?? ""}" title="${esc(g.name)} 에 부속품 추가"><span>+</span>부속품</button>`}
    </div></section>`).join("")}</div>`;
}

// 사진 타일: 사진(없으면 첫 글자) · 상태 배지 · 이름 · 구매처 · 남은 수량 · 개당 단가
function tile(p) {
  const lv = level(p), used = usedBy(p);
  const flag = lv === "out" ? '<span class="badge bad">없음</span>' : lv === "low" ? '<span class="badge warn">부족</span>' : "";
  return `<button type="button" class="ptile ${lv === "ok" ? "" : lv}" data-id="${p.id}" title="${esc(p.name)} · 알림 기준 ${num(p.alert)}${esc(p.unit)}${used.length ? `\n사용 제품: ${used.map((u) => `${u.name} ${u.qty}${p.unit}`).join(", ")}` : ""}">
    <span class="photo ${p.photo ? "" : "none"}">${p.photo ? `<img src="${p.photo}" alt="">` : `<span><b>${esc(p.name[0])}</b>사진 없음</span>`}</span>
    ${buyLink(p)}<span class="flag">${flag}</span>
    <span class="body"><span class="pn">${esc(p.name)}</span>
      <span class="sub">${esc(p.shop) || "구매처 없음"} · 제품 ${used.length}개</span>
      <span class="foot"><span class="left">${num(p.stock)}<small>${esc(p.unit)}</small></span>
        <span class="uprice ${p.price == null ? "none" : ""}">${p.price == null ? "가격 미입력" : `${unitWon(unitPrice(p))}/${esc(p.unit)}`}</span></span></span>
  </button>`;
}

function row(p) {
  const used = usedBy(p);
  return `<tr data-id="${p.id}">
    <td class="pname">${esc(p.name)}${buyLink(p)}</td>
    <td>${catBadge(p)}</td>
    <td>${esc(p.shop) || '<span class="muted">-</span>'}</td>
    <td class="num">${p.price == null ? '<span class="badge warn">미입력</span>' : won(p.price)}</td>
    <td class="num">${p.pack_qty.toLocaleString("ko-KR")}${esc(p.unit)}</td>
    <td class="num unit-price">${p.price == null ? '<span class="muted">-</span>' : unitWon(unitPrice(p))}</td>
    <td class="num"><b style="color:${level(p) === "out" ? "var(--bad)" : level(p) === "low" ? "var(--warn)" : "inherit"}">${num(p.stock)}${esc(p.unit)}</b></td>
    <td class="num ${used.length ? "used" : "muted"}" ${used.length ? `title="${esc(used.map((u) => `${u.name} · ${u.qty}${p.unit}`).join("\n"))}"` : ""}>${used.length ? `${used.length}개` : "-"}</td>
    <td class="note" title="${esc(p.note)}">${esc(p.note)}</td></tr>`;
}

function bindView() {
  const q = $("#q");
  q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#f-sort").onchange = (e) => { state.sort = e.target.value; render(); };
  $("#f-cat").onchange = (e) => { state.cat = e.target.value; render(); };
  $("#view").onclick = (e) => {
    if (e.target.closest(".help, [data-link]")) return;  // (?) · 구매 링크를 눌러도 필터 · 수정 창이 열리지 않게
    const b = e.target.closest("[data-act]");
    if (b) {
      return ({
        manage: () => openManage(),
        replace: () => openReplace(),
        low: () => { if (!db.parts.some((p) => level(p) !== "ok")) return; state.lowOnly = !state.lowOnly; render(); },
        "no-price": () => { if (!db.parts.some((p) => p.price == null)) return; state.noPriceOnly = !state.noPriceOnly; render(); },
        clear: () => { Object.assign(state, { q: "", noPriceOnly: false, lowOnly: false, cat: "" }); render(); },
      })[b.dataset.act]();
    }
    const v = e.target.closest("[data-view]"); if (v) { state.view = v.dataset.view; return render(); }
    const add = e.target.closest("[data-add-in]"); if (add) return openPart(null, dlg, add.dataset.addIn ? { category: Number(add.dataset.addIn) } : {});
    const tr = e.target.closest("tr[data-id], .ptile[data-id]");
    if (tr) openPart(byId(db.parts, tr.dataset.id));
  };
}

// ---------------------------------------------------------------- 대화상자 공통
const dlg = { el: $("#dlg"), form: $("#dlg-form") };
const dlg2 = { el: $("#dlg2"), form: $("#dlg2-form") };
function show(dl, html, cls = "") {
  dl.el.className = cls; dl.form.innerHTML = html;
  dl.form.onclick = dl.form.onchange = dl.form.oninput = dl.form.onsubmit = null;
  if (!dl.el.open) dl.el.showModal();
}
// 저장 후 목록과 (열려 있으면) 부속품 관리 창을 함께 갱신
const refresh = () => { render(); if (dlg.el.open && $("#dlg .manage")) openManage(); };
const dlg3 = { el: $("#dlg3"), form: $("#dlg3-form") };
const dlg4 = { el: $("#dlg4"), form: $("#dlg4-form") };
const nextDlg = () => [dlg, dlg2, dlg3, dlg4].find((d) => !d.el.open);
// 확인 대화상자 (common.html TBD-09). opts: { title, lead, effects: [{ t, d: [html], tone }], danger, twice, okLabel, onOk }
function confirmBox(o) {
  const d = nextDlg();
  show(d, `<div class="dlg-head">${esc(o.title)}</div>
    <div class="dlg-body"><p class="lead">${o.lead}</p>
      ${o.effects?.length ? `<div class="effects">${o.effects.map((x) => `<div class="effect ${x.tone || ""}"><div class="t">${x.t}</div>${(x.d || []).map((y) => `<div class="d">${y}</div>`).join("")}</div>`).join("")}</div>` : ""}
      <div class="again" hidden>${o.againText || "한 번 더 누르면 실행돼요."}</div></div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>
      <button type="button" class="btn ${o.danger ? (o.twice ? "danger-line" : "danger-fill") : "primary"}" data-ok>${esc(o.okLabel || "삭제")}</button></div>`,
    `narrow confirm ${o.effects?.length ? "has-effects" : ""}`);
  d.form.querySelector("[data-close]").focus();
  let armed = !o.twice;
  d.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return d.el.close();
    const ok = e.target.closest("[data-ok]"); if (!ok) return;
    if (!armed) { armed = true; ok.className = `btn ${o.danger ? "danger-fill" : "primary"}`; ok.textContent = o.againLabel || "정말 삭제"; d.form.querySelector(".again").hidden = false; return ok.focus(); }
    d.el.close(); o.onOk?.();
  };
}

// ---------------------------------------------------------------- 부속품 관리 (구매처별 / 카테고리별 → 부속품)
// 선택 키: "" = 전체, "s:쿠팡" = 구매처, "c:1" = 카테고리, "none" = 구매처 없음 / 미분류 (보기에 따라)
let manageBy = "shop", manageSel = "";
const inSel = (p, sel) => !sel ? true : sel === "none" ? (manageBy === "shop" ? !p.shop : p.category == null)
  : sel.startsWith("s:") ? p.shop === sel.slice(2) : p.category === Number(sel.slice(2));
const selLabel = (sel) => !sel ? "전체" : sel === "none" ? (manageBy === "shop" ? "구매처 없음" : "미분류") : sel.startsWith("s:") ? sel.slice(2) : catName(sel.slice(2));
function openManage() {
  const shops = [...new Set(db.parts.map((p) => p.shop).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const hasNone = manageBy === "shop" ? db.parts.some((p) => !p.shop) : db.parts.some((p) => p.category == null);
  const keys = manageBy === "shop" ? shops.map((x) => `s:${x}`) : db.categories.map((c) => `c:${c.id}`);
  if (manageSel && !(manageSel === "none" ? hasNone : keys.includes(manageSel))) manageSel = "";
  const count = (sel) => db.parts.filter((p) => inSel(p, sel)).length;
  const item = (sel) => `<div class="list-item ${sel === manageSel ? "active" : ""} ${sel === "none" ? "no-shop" : ""}" data-sel="${esc(sel)}">
      <div class="grow"><strong>${esc(selLabel(sel))}</strong><small>부속품 ${count(sel)}개</small></div>
      ${sel.startsWith("c:") ? `<button type="button" class="icon-btn edit" data-edit-cat="${sel.slice(2)}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ""}</div>`;
  const partRow = (p) => {
    const used = usedBy(p).length;
    return `<div class="row-item"><div><strong>${esc(p.name)}</strong>${buyLink(p)}<div class="hint">${manageBy === "shop" ? catName(p.category) || "미분류" : esc(p.shop) || "구매처 없음"} · 제품 ${used}개에서 사용</div></div>
      <div class="price">${p.price == null ? '<span class="badge warn">가격 미입력</span>' : `${unitWon(unitPrice(p))}<div class="hint">${esc(p.unit)}당</div>`}</div>
      <div class="row-btns"><button type="button" class="icon-btn edit" data-copy-part="${p.id}" title="복제" aria-label="복제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button><button type="button" class="icon-btn edit" data-edit-part="${p.id}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div></div>`;
  };
  const parts = db.parts.filter((p) => inSel(p, manageSel)).sort(byName);
  const tabs = `<div class="view-tabs"><button type="button" data-by="shop" class="${manageBy === "shop" ? "active" : ""}">구매처별</button><button type="button" data-by="cat" class="${manageBy === "cat" ? "active" : ""}">카테고리별</button></div>`;
  // 보기 전환(구매처별 / 카테고리별)은 창 제목 줄 오른쪽 (필라멘트 관리의 탭과 같은 자리)
  show(dlg, `<div class="dlg-head">부속품 관리<span style="flex:1"></span>${tabs}</div><div class="dlg-body cols"><div class="manage">
      <div class="col"><div class="col-head"><h4>${manageBy === "shop" ? "구매처" : "카테고리"}</h4><span class="count">${keys.length}</span><div class="spacer"></div>${manageBy === "cat" ? '<button type="button" class="btn small add" data-add-cat>+ 추가</button>' : ""}</div>
        <div class="col-scroll"><div class="list">${keys.map(item).join("")}${hasNone ? item("none") : ""}</div></div></div>
      <div class="col manage-right"><div class="col-head"><h4>${esc(selLabel(manageSel))} 부속품</h4><span class="count">${parts.length}</span><div class="spacer"></div><button type="button" class="btn small add" data-add-part>+ 부속품 추가</button></div>
        <div class="col-scroll">${parts.map(partRow).join("") || '<p class="hint">등록된 부속품이 없어요.</p>'}</div></div>
    </div></div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`, "wide fixed");
  dlg.form.onclick = (e) => {
    const t = e.target, get = (k) => byId(db.parts, t.closest(`[data-${k}]`).dataset[k.replace(/-(\w)/g, (_, c) => c.toUpperCase())]);
    if (t.closest("[data-link]")) return;
    if (t.closest("[data-close]")) return dlg.el.close();
    const by = t.closest("[data-by]"); if (by) { manageBy = by.dataset.by; manageSel = ""; return openManage(); }
    if (t.closest("[data-add-cat]")) return openCategory(null);
    if (t.closest("[data-edit-cat]")) return openCategory(byId(db.categories, t.closest("[data-edit-cat]").dataset.editCat));
    if (t.closest("[data-edit-part]")) return openPart(get("edit-part"), dlg2);
    if (t.closest("[data-copy-part]")) return openPart(null, dlg2, { copyOf: get("copy-part") });
    if (t.closest("[data-add-part]")) return openPart(null, dlg2, manageSel.startsWith("s:") ? { shop: manageSel.slice(2) } : manageSel.startsWith("c:") ? { category: Number(manageSel.slice(2)) } : {});
    if (t.closest("[data-del-part]")) {
      const p = get("del-part"), used = usedBy(p).length;
      if (used) return toast(`제품 ${used}개에서 쓰고 있어서 삭제할 수 없어요`);
      return confirmBox({ title: "부속품 삭제", lead: `<b>${esc(p.name)}</b> 을(를) 삭제할까요?`, danger: true,
        onOk: () => { db.parts = db.parts.filter((x) => x !== p); refresh(); toast(`${p.name} 삭제했어요`); } });
    }
    const it = t.closest("[data-sel]");
    // 고른 것을 다시 누르면 전체로 (v1.2.0, 제품 관리 창과 같음. "전체" 항목은 두지 않음)
    if (it) { manageSel = it.dataset.sel === manageSel ? "" : it.dataset.sel; openManage(); }
  };
}

// 부속품 카테고리 추가 / 수정 (TBD-17). 지우면 그 카테고리의 부속품은 미분류로 (원가는 그대로)
function openCategory(c) {
  const n = c ? db.parts.filter((p) => p.category === c.id).length : 0;
  const d = nextDlg();
  show(d, `<div class="dlg-head">${c ? "카테고리 수정" : "카테고리 추가"}</div><div class="dlg-body">
      <label class="field"><span>카테고리 이름 *</span><input name="name" required value="${esc(c?.name)}" placeholder="예: 전자 부품"></label>
      ${c ? `<p class="hint" style="margin:10px 0 0">부속품 ${n}개</p>` : ""}</div>
    <div class="dlg-foot">${c ? '<button type="button" class="btn danger" data-del>삭제</button>' : ""}<div class="spacer"></div>
      <button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">저장</button></div>`, "narrow");
  d.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return d.el.close();
    // 부속품이 있으면 그 부속품이 미분류로 바뀌므로 2차 확인 (screens.md 공통 "삭제 확인")
    if (e.target.closest("[data-del]")) confirmBox({ title: "카테고리 삭제", lead: `<b>${esc(c.name)}</b> 카테고리를 삭제할까요?`, danger: true, twice: n > 0,
      againText: "한 번 더 누르면 삭제돼요.",
      effects: n ? [{ t: `부속품 ${n}개가 미분류가 돼요`, tone: "warn", d: [esc(db.parts.filter((p) => p.category === c.id).map((p) => p.name).join(" · ")), "부속품과 제품 원가는 그대로예요."] }] : [],
      onOk: () => { db.parts.forEach((p) => { if (p.category === c.id) p.category = null; }); db.categories = db.categories.filter((x) => x !== c); d.el.close(); refresh(); toast("삭제했어요"); } });
  };
  d.form.onsubmit = (e) => {
    e.preventDefault(); const name = d.form.elements.name.value.trim();
    if (db.categories.some((x) => x.name === name && x !== c)) return toast("이미 있는 카테고리예요");
    if (c) c.name = name; else { const nc = { id: Math.max(0, ...db.categories.map((x) => x.id)) + 1, name }; db.categories.push(nc); if (manageBy === "cat") manageSel = `c:${nc.id}`; }
    d.el.close(); refresh(); if (dlg2.el.open && $("#dlg2 [name=category]")) $("#dlg2 [name=category]").innerHTML = catOpts(Number($("#dlg2 [name=category]").value) || null);
    toast("저장했어요");
  };
}

// ---------------------------------------------------------------- 남은 수량 조정 (포장 탭 packaging.html 과 같음)
function openAdjust(it, done) {
  const d = nextDlg();
  show(d, `<div class="dlg-head">남은 수량 조정 <span class="hint" style="font-weight:400">${esc(it.name)}</span></div>
    <div class="dlg-body"><div class="form-grid">
      <div class="field full"><span>방식</span><div class="seg">
        <label><input type="radio" name="mode" value="set" checked><span>실제 수량으로 맞추기</span></label>
        <label><input type="radio" name="mode" value="minus"><span>빼기</span></label>
        <label><input type="radio" name="mode" value="plus"><span>더하기</span></label></div></div>
      <label class="field"><span id="adj-label">세어 본 수량</span><div class="with-suffix"><input type="number" name="qty" value="${it.stock}"><em>${esc(it.unit)}</em></div></label>
      <label class="field"><span>사유</span><input name="reason" list="reasons" placeholder="예: 재고 실사"></label>
      <div class="field full"><div class="adj-preview"><span>지금 <b>${num(it.stock)}${esc(it.unit)}</b> →</span><b id="adj-after"></b></div>
        <span class="hint" style="font-size:12px">구매는 지출 장부에서 넣으면 자동으로 더해져요. 여기는 그 밖의 차이만</span></div>
    </div></div>
    <datalist id="reasons"><option value="재고 실사"><option value="파손 · 불량"><option value="샘플 · 시험 출력"><option value="지출 없이 받음"></datalist>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">조정</button></div>`);
  const f = d.form.elements;
  const after = () => { const q = Number(f.qty.value) || 0; return f.mode.value === "set" ? q : f.mode.value === "plus" ? it.stock + q : it.stock - q; };
  const upd = () => { const a = after(), x = a - it.stock; $("#adj-label", d.form).textContent = f.mode.value === "set" ? "세어 본 수량" : "수량"; $("#adj-after", d.form).textContent = `${num(a)}${it.unit} (${x >= 0 ? "+" : ""}${num(x)})`; };
  let last = "set";
  d.form.onchange = d.form.oninput = (e) => { if (e.target.name === "mode" && e.target.value !== last) { last = e.target.value; f.qty.value = last === "set" ? it.stock : 1; } upd(); };
  upd();
  d.form.onclick = (e) => { if (e.target.closest("[data-close]")) d.el.close(); };
  d.form.onsubmit = (e) => {
    e.preventDefault();
    const a = after(); if (a === it.stock) return toast("바뀐 수량이 없어요");
    it.stock = a; d.el.close(); render(); done?.(); toast(`${it.name} ${num(a)}${it.unit} 으로 조정했어요`);
  };
}

// ---------------------------------------------------------------- 부속품 추가 / 복제 / 수정
// dl: 목록에서 열면 dlg, 부속품 관리 창에서 열면 그 위에 dlg2
// preset.shop: 관리 창에서 고른 구매처, preset.copyOf: 복제할 원본 (사용하는 제품은 복사하지 않음)
function openPart(p, dl = dlg, preset = {}) {
  const used = p ? usedBy(p) : [];
  const src = preset.copyOf;
  const init = p ?? (src ? { ...src, name: `${src.name} (복사)` } : { shop: preset.shop ?? "", category: preset.category ?? null, buy_url: "" });
  show(dl, `<div class="dlg-head">${p ? "부속품 수정" : "부속품 추가"}${p ? "" : src ? `<span class="hint" style="font-weight:400">${esc(src.name)}에서 복제</span>` : '<span class="badge info">새 부속품</span>'}</div>
    <div class="dlg-body"><div class="form-grid">
      <div class="field full"><span>사진</span><div class="photo-field">
        <div class="photo-box" id="photo-box"></div>
        <div class="photo-btns"><label class="btn small"><input type="file" accept="image/*" id="photo-file"><span id="photo-pick"></span></label>
          <button type="button" class="btn small danger" id="photo-clear">사진 빼기</button>
          <span class="hint" style="font-size:12px">카드에 크게 보여요 · 구매 페이지 사진이나 직접 찍은 사진</span></div></div></div>
      <label class="field full"><span>품목 *</span><input name="name" required autofocus value="${esc(init.name)}" placeholder="예: 네오디뮴 자석 6×3mm"></label>
      <label class="field"><span>카테고리</span><select name="category">${catOpts(init.category)}</select></label>
      <label class="field"><span>회사/구매처</span><input name="shop" value="${esc(init.shop)}" placeholder="예: 쿠팡"></label>
      <label class="field full"><span>구매 링크</span><input name="buy_url" type="url" value="${esc(init.buy_url)}" placeholder="https://… (목록의 구매 버튼으로 바로 열려요)"><span class="err" id="url-err" hidden>https:// 로 시작하는 주소로 입력하세요</span></label>
      <label class="field"><span>구매가 (묶음 전체)</span><div class="with-suffix"><input type="number" name="price" min="0" step="100" value="${init.price ?? ""}" placeholder="미입력"><em>원</em></div>
        <span class="hint" style="font-size:12px">${p && LAST_BUY[p.id] ? `최근 구매가 · ${LAST_BUY[p.id].date.replaceAll("-", ".")} ${esc(LAST_BUY[p.id].name)} (지출)` : "지출에 이 부속품을 넣으면 최근 구매가로 자동"}</span></label>
      <div class="field"><span>묶음 수량 · 단위</span><div class="qty-unit"><input type="number" name="pack_qty" min="1" step="1" value="${init.pack_qty ?? 1}" aria-label="묶음 수량"><input name="unit" list="units" value="${esc(init.unit ?? "개")}" aria-label="단위"></div></div>
      <div class="field full"><div class="unit-preview" id="unit-preview"></div></div>
      <div class="field"><span>남은 수량</span>${p ? `<div class="stock-now"><b>${num(p.stock)}${esc(p.unit)}</b><button type="button" class="btn small" data-adjust>조정</button></div>
        <span class="hint" style="font-size:12px">구매(지출) · 판매로 자동으로 바뀌어요. 실제와 다르면 조정</span>`
        : `<div class="with-suffix"><input type="number" name="stock" min="0" value="${init.stock ?? 0}"><em>${esc(init.unit ?? "개")}</em></div><span class="hint" style="font-size:12px">처음 등록할 때 지금 가진 수량</span>`}</div>
      <label class="field"><span>부족 알림 기준 ${help("남은 수량이 이 값 이하면 `부족` · 0 이하면 `없음`")}</span><div class="with-suffix"><input type="number" name="alert" min="0" value="${init.alert ?? 10}"><em>이하</em></div></label>
      <label class="field full"><span>비고</span><textarea name="note" rows="2" placeholder="규격 등">${esc(init.note)}</textarea></label>
      ${p ? `<div class="field full"><div class="used-head"><span class="muted" style="font-size:12px;font-weight:600">사용하는 제품 ${used.length}개${used.length ? " · 제품 1개당 금액" : ""}</span></div>
        <div id="used-list">${used.length ? "" : '<p class="hint" style="margin:4px 0">아직 이 부속품을 쓰는 제품이 없어요.</p>'}</div></div>` : ""}
    </div></div>
    <div class="dlg-foot">
      ${p ? `<button type="button" class="btn danger" data-del ${used.length ? `disabled title="제품 ${used.length}개에서 쓰고 있어서 삭제할 수 없어요"` : ""}>삭제</button>
        ${used.length ? `<span class="foot-note">제품에서 쓰는 중이라 삭제 불가</span>` : ""}` : ""}
      <div class="spacer"></div>
      <button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">저장</button></div>`);
  const form = dl.form;
  let photo = init.photo ?? null;
  const drawPhoto = () => {
    $("#photo-box", form).innerHTML = photo ? `<img src="${photo}" alt="">` : "사진 없음";
    $("#photo-pick", form).textContent = photo ? "사진 바꾸기" : "사진 넣기";
    $("#photo-clear", form).hidden = !photo;
  };
  drawPhoto();
  $("#photo-file", form).onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { photo = r.result; drawPhoto(); }; r.readAsDataURL(f);
  };
  $("#photo-clear", form).onclick = () => { photo = null; drawPhoto(); };
  const read = () => {
    const fd = new FormData(form);
    return { name: fd.get("name").trim(), category: fd.get("category") ? Number(fd.get("category")) : null, buy_url: fd.get("buy_url").trim(), shop: fd.get("shop").trim(), price: fd.get("price") === "" ? null : Number(fd.get("price")),
      pack_qty: Math.max(1, Number(fd.get("pack_qty")) || 1), unit: fd.get("unit").trim() || "개", note: fd.get("note").trim(),
      alert: Math.max(0, Number(fd.get("alert")) || 0), photo };
  };
  // 단가 미리보기 · 사용하는 제품 금액: 수정 중에 단가가 바뀌면 이전 값도 함께
  const preview = () => {
    const d = read(), before = p ? unitPrice(p) : null, after = unitPrice(d);
    const changed = p && before !== after;
    $("#unit-preview").innerHTML = d.price == null
      ? '<span class="muted">구매가를 넣으면 개당 단가를 계산해요</span><span class="badge warn">가격 미입력 · 원가에 0원</span>'
      : `<span class="muted">${won(d.price)} ÷ ${d.pack_qty.toLocaleString("ko-KR")}${esc(d.unit)}</span>
         <span>${changed && before != null ? `<span class="was">${unitWon(before)}</span>` : ""}${esc(d.unit)}당 <b>${unitWon(after)}</b></span>`;
    if (!used.length) return;
    $("#used-list").innerHTML = used.map((u) => {
      const a = before == null ? null : before * u.qty, b = after == null ? null : after * u.qty;
      const diff = changed && a != null && b != null && Math.round(a) !== Math.round(b);
      return `<div class="used-row"><span>${esc(u.name)}${statusBadge(u.status)}</span><span class="qty">${u.qty.toLocaleString("ko-KR")}${esc(d.unit)}</span>
        <span class="amt">${changed ? `<span class="was">${a == null ? "0원" : won(a)} → </span><span class="${diff ? (b > a ? "up" : "down") : ""}">${b == null ? "0원" : won(b)}</span>` : (a == null ? '<span class="muted">0원</span>' : won(a))}</span></div>`;
    }).join("");
  };
  // 구매 링크: 주소 형식이 아니면 빨간 안내
  const urlCheck = () => {
    const v = form.elements.buy_url.value.trim();
    $("#url-err", form).hidden = !v || /^https?:\/\/\S+\.\S+/.test(v);
  };
  preview(); urlCheck();
  form.oninput = () => { preview(); urlCheck(); };
  form.onchange = (e) => { if (e.target.name === "category" && e.target.value === "new") { e.target.value = init.category ?? ""; openCategory(null); } };
  form.onclick = (e) => {
    if (e.target.closest(".help")) return e.preventDefault();
    if (e.target.closest("[data-close]")) return dl.el.close();
    if (e.target.closest("[data-adjust]")) return openAdjust(p, () => { dl.el.close(); openPart(p, dl); });
    if (e.target.closest("[data-del]")) {
      // 그것만 지워지는 삭제라 확인 한 번 (screens.md 공통 "삭제 확인")
      confirmBox({ title: "부속품 삭제", lead: `<b>${esc(p.name)}</b> 을(를) 삭제할까요?`, danger: true,
        onOk: () => { db.parts = db.parts.filter((x) => x !== p); dl.el.close(); refresh(); toast(`${p.name} 삭제했어요`); } });
    }
  };
  form.onsubmit = (e) => {
    e.preventDefault(); const d = read();
    if (db.parts.some((x) => x.name === d.name && x !== p)) return toast("이미 있는 품목이에요");
    if (d.buy_url && !/^https?:\/\/\S+\.\S+/.test(d.buy_url)) return toast("구매 링크 주소를 확인하세요");
    const priceChanged = p && unitPrice(p) !== unitPrice(d);
    if (p) Object.assign(p, d); else db.parts.push({ ...d, stock: Math.max(0, Number(form.elements.stock.value) || 0), id: Math.max(0, ...db.parts.map((x) => x.id)) + 1 });
    dl.el.close(); refresh();
    toast(priceChanged && used.length ? `저장했어요 · 제품 ${used.length}개 원가에 바로 반영돼요` : "저장했어요");
  };
}

// ---------------------------------------------------------------- 제품의 부속품 바꾸기 (TBD-23)
// 제품에서 쓰는 A 부속품 줄을 B 로. 수량은 그대로, 그 제품에 이미 B 가 있으면 수량을 더해 한 줄로.
// 부속품 자체는 그대로 (A 도 남는다). 서버는 한 번에 처리 (하나라도 실패하면 아무것도 안 바꿈)
const catOpts = (sel) => `<option value="">미분류</option>${db.categories.map((c) => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${esc(c.name)}</option>`).join("")}<option value="new">+ 새 카테고리…</option>`;
function openReplace() {
  const d = nextDlg();
  let a = null, b = null; const off = new Set();
  const usedParts = db.parts.filter((x) => usedBy(x).length).sort(byName);
  const draw = () => {
    const users = a ? db.products.filter((x) => x.parts.some(([id]) => id === a.id)) : [];
    const ua = a ? unitPrice(a) : null, ub = b ? unitPrice(b) : null;
    const rows = users.map((x) => {
      const q = x.parts.find(([id]) => id === a.id)[1], has = b && x.parts.find(([id]) => id === b.id);
      const before = ua == null ? null : ua * q, after = !b ? null : ub == null ? null : ub * q;
      const diff = b && before != null && after != null && Math.round(before) !== Math.round(after);
      return `<label class="rep-row ${off.has(x.id) ? "off" : ""}"><input type="checkbox" data-pid="${x.id}" ${off.has(x.id) ? "" : "checked"}>
        <span>${esc(x.name)}${statusBadge(x.status)}${has ? `<span class="merge">이미 ${esc(b.name)} ${has[1]}${esc(b.unit)} 있음 → 합쳐서 ${has[1] + q}${esc(b.unit)}</span>` : ""}</span>
        <span class="qty">${q}${esc(a.unit)}</span>
        <span class="amt">${!b ? won(before ?? 0) : `<span class="was">${won(before ?? 0)} → </span><span class="${diff ? (after > before ? "up" : "down") : ""}">${won(after ?? 0)}</span>`}</span></label>`;
    }).join("");
    const n = users.length - off.size;
    show(d, `<div class="dlg-head">제품의 부속품 바꾸기</div><div class="dlg-body">
        <p class="hint" style="margin:0 0 12px">제품에서 쓰는 부속품을 다른 부속품으로 한 번에 바꿔요. 부속품 자체는 지워지거나 바뀌지 않아요.</p>
        <div class="form-grid"><label class="field"><span>지금 쓰는 부속품 *</span><select name="from"><option value="">고르세요</option>${usedParts.map((x) => `<option value="${x.id}" ${x === a ? "selected" : ""}>${esc(x.name)} · 제품 ${usedBy(x).length}개</option>`).join("")}</select></label>
          <label class="field"><span>바꿀 부속품 *</span><select name="to" ${a ? "" : "disabled"}><option value="">고르세요</option>${db.parts.filter((x) => x !== a).sort(byName).map((x) => `<option value="${x.id}" ${x === b ? "selected" : ""}>${esc(x.name)}${a && x.unit !== a.unit ? ` (${esc(x.unit)})` : ""}</option>`).join("")}</select></label></div>
        ${a && b && b.unit !== a.unit ? `<div class="notice">단위가 달라요: <b>${esc(a.unit)} → ${esc(b.unit)}</b>. 수량은 그대로 옮기니, 바꾼 뒤 제품마다 수량을 확인하세요.</div>` : ""}
        ${a ? `<div class="used-head" style="margin-top:14px"><span class="muted" style="font-size:12px;font-weight:600">바꿀 제품 ${n} / ${users.length} · 제품 1개당 금액</span></div>${rows}` : ""}</div>
      <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>
        <button type="button" class="btn" data-go="picked" ${a && b && n && n < users.length ? "" : "disabled"}>고른 제품 ${n}개만 바꾸기</button>
        <button type="button" class="btn primary" data-go="all" ${a && b ? "" : "disabled"}>전부 바꾸기${a ? ` (${users.length}개)` : ""}</button></div>`, "wide");
    d.form.onchange = (e) => {
      if (e.target.name === "from") { a = byId(db.parts, e.target.value) || null; if (b === a) b = null; off.clear(); return draw(); }
      if (e.target.name === "to") { b = byId(db.parts, e.target.value) || null; return draw(); }
      if (e.target.dataset.pid) { const id = Number(e.target.dataset.pid); e.target.checked ? off.delete(id) : off.add(id); draw(); }
    };
    d.form.onclick = (e) => {
      if (e.target.closest("[data-close]")) return d.el.close();
      const go = e.target.closest("[data-go]"); if (!go || go.disabled) return;
      const picked = go.dataset.go === "all" ? users : users.filter((x) => !off.has(x.id));
      // 다른 데이터(제품의 부속품 줄)가 바뀌는 동작이라 2차 확인
      confirmBox({ title: "부속품 바꾸기", lead: `<b>${esc(a.name)}</b> → <b>${esc(b.name)}</b> 로 바꿀까요?`, twice: true, okLabel: "바꾸기", againLabel: "정말 바꾸기",
        againText: "한 번 더 누르면 바꿔요.",
        effects: [{ t: `제품 ${picked.length}개의 부속품이 바뀌어요`, tone: "info", d: [esc(picked.map((x) => x.name).join(" · ")), "원가가 바로 다시 계산돼요."] }],
        onOk: () => {
          picked.forEach((x) => {
            const ra = x.parts.find(([id]) => id === a.id), rb = x.parts.find(([id]) => id === b.id);
            if (rb) { rb[1] += ra[1]; x.parts = x.parts.filter((r) => r !== ra); } else ra[0] = b.id;
          });
          d.el.close(); refresh(); toast(`제품 ${picked.length}개를 ${b.name} 로 바꿨어요`);
        } });
    };
  };
  draw();
}

// ---------------------------------------------------------------- 시작
const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
// 사이드바 접힘 상태는 브라우저에 기억 (filaments.html 과 같은 키)
function toggleSide(force) {
  const el = $("#layout");
  const collapsed = force ?? !el.classList.contains("collapsed");
  el.classList.toggle("collapsed", collapsed);
  $("[data-act='toggle-side'] .label").textContent = collapsed ? "펼치기" : "접기";
  try { localStorage.setItem("pff-side-collapsed", collapsed ? "1" : "0"); } catch { /* 저장 불가 */ }
}
let savedSide = null;
try { savedSide = localStorage.getItem("pff-side-collapsed"); } catch { /* 저장 불가 */ }
if (params.get("side") === "collapsed" || savedSide === "1") toggleSide(true);
if (params.get("view") === "table") state.view = "table";
render();
({
  part: () => openPart(db.parts[0]),
  "part-new": () => openPart(null),
  "part-unused": () => openPart(db.parts.find((p) => p.id === 8)),
  manage: () => openManage(),
  adjust: () => openAdjust(db.parts[2]),
})[params.get("open")]?.();
</script>
</body>
</html>
