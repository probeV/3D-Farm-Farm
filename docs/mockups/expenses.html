<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지출 — 3D Farm Farm 목업</title>
<!--
  지출 장부 HTML 목업 (docs/PRD.md 3.10 EXP-01 ~ 08 기준)
  - 더미 데이터로 동작하며 새로고침하면 초기화된다. 오늘은 2026-10-28 로 고정.
  - 스크린샷용: ?open=expense | expense-new | recurring | recurring-add,  ?theme=dark | light
-->
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e2e5ea;
  --text: #1c2026; --muted: #6b7380; --accent: #2f6fed; --accent-soft: #e8efff;
  --good: #1f9254; --warn: #b7791f; --bad: #d64545; --good-soft: #e6f5ec; --warn-soft: #fff6e5; --bad-soft: #fdecec;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 10px; color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #24282e; --border: #30353d;
  --text: #e8eaee; --muted: #9aa2ad; --accent: #6b9bff; --accent-soft: #1f2a44;
  --good: #4cc38a; --warn: #e5b04a; --bad: #ff6b6b; --good-soft: #1b3127; --warn-soft: #3a3020; --bad-soft: #3d2224;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

/* 사이드바: 접으면 아이콘만, 펼치면 이름까지 */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; --side-w: 220px; transition: grid-template-columns .15s; }
.layout.collapsed { --side-w: 64px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.side-brand .mark { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 800; letter-spacing: -.5px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; text-align: left; text-decoration: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.layout.collapsed .label { display: none; }
.layout.collapsed .nav-item, .layout.collapsed .side-brand { justify-content: center; padding-left: 0; padding-right: 0; }
.mock-tag { font-size: 11px; color: var(--muted); padding: 0 10px; white-space: nowrap; }
.layout.collapsed .mock-tag { display: none; }
main { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px; }
.page-title { margin: 0 0 14px; font-size: 20px; }

/* 공통 */
h4 { margin: 0; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; padding: 7px 14px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.add { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn.add:hover { background: var(--accent); color: #fff; }
input, select, textarea { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input[type=number] { text-align: right; }
textarea { resize: vertical; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); border-radius: 6px; font-size: 15px; width: 32px; height: 32px; }
.icon-btn:hover { background: var(--surface-2); color: var(--bad); }

/* 위쪽 줄 · 요약 카드 (부자재 화면과 같은 모양) */
.top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.top-row .spacer { flex: 1; }
.sum-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 4px; padding: 2px; }
.sum-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: left; }
.sum-card > span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.sum-card strong { display: block; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.sum-card strong small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.sum-card .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sum-card.invest strong { color: var(--accent); }
.help { position: relative; display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--border); font-size: 10px; font-weight: 700; color: var(--muted); cursor: help; vertical-align: 1px; }
.help:hover, .help:focus { color: var(--accent); border-color: var(--accent); outline: 0; }
.help::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); width: max-content; max-width: 260px; padding: 6px 10px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 500; line-height: 1.4; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .1s; z-index: 10; }
.help:hover::after, .help:focus::after { opacity: 1; }
/* 창 맨 위처럼 위쪽 자리가 없을 때는 아래로 */
.help.down::after { bottom: auto; top: calc(100% + 6px); left: -70px; transform: none; max-width: 300px; }

/* 반복 지출 알림 줄: 이번 달에 아직 안 넣은 구독이 있을 때만 */
.due { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 10px 14px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--radius); font-size: 13.5px; }
.due .spacer { flex: 1; }
.due b { color: var(--accent); }

/* 분류별 합계: 기간을 따라 바뀜. 줄을 누르면 그 분류만 */
.by-cat { margin-top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; }
.by-cat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.by-cat-head h4 { font-size: 13px; }
.by-cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.cat-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 5px 6px; margin: 0 -6px; border: 0; background: none; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
.cat-row:hover { background: var(--surface-2); }
.cat-row.active { background: var(--accent-soft); }
.cat-row.zero { color: var(--muted); }
.cat-row .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cat-row .bar i { display: block; height: 100%; border-radius: 99px; background: var(--muted); }
.cat-row[data-cat="invest"] .bar i { background: var(--accent); }
.cat-row .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* 목록 제목 줄 */
.section-head { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; flex-wrap: wrap; }
.section-head .spacer { flex: 1; }
.section-head h3 { margin: 0 4px 0 0; font-size: 15px; }
.section-head input[type=search] { width: 200px; }
.section-head .total { font-weight: 700; font-variant-numeric: tabular-nums; }
.range { display: inline-flex; align-items: center; gap: 4px; }
.range input { width: 140px; }

/* 지출 표 */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.date { font-variant-numeric: tabular-nums; color: var(--muted); }
.ename { font-weight: 700; font-size: 14px; }
.amount { font-weight: 700; }
.note { max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.rec-mark { margin-left: 6px; font-size: 11px; color: var(--accent); font-weight: 600; }
/* 열 제목 정렬 (common.html TBD-05) */
th.sortable { padding: 0; }
th.sortable button { display: inline-flex; align-items: center; gap: 4px; width: 100%; padding: 10px 12px; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
th.num.sortable button { justify-content: flex-end; }
th.sortable button:hover { color: var(--text); }
th.sortable .arrow { width: 10px; opacity: 0; }
th.sortable button:hover .arrow { opacity: .4; }
th.sorted { color: var(--accent); }
th.sorted .arrow, th.sorted button:hover .arrow { opacity: 1; }

/* 분류 배지: 투자(장비)만 파란색 (누적 투자금에 들어가는 것) */
.cat { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--text); font-size: 12px; font-weight: 600; }
.cat.invest { background: var(--accent-soft); color: var(--accent); }

/* 주문 링크: 항목 옆 아이콘 (누르면 새 탭, 행 클릭과 겹치지 않게 — parts.html 구매 링크와 같음) */
.buy-link { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; padding: 1px 7px; border: 1px solid var(--border); border-radius: 6px; color: var(--accent); background: var(--surface); font-size: 11.5px; font-weight: 600; vertical-align: 1px; text-decoration: none; }
.buy-link:hover { border-color: var(--accent); background: var(--accent-soft); }
.buy-link svg { width: 12px; height: 12px; }

/* 대화상자 */
dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.3); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10,14,20,.45); }
dialog.wide { width: min(760px, calc(100vw - 32px)); }
dialog.narrow { width: min(400px, calc(100vw - 32px)); }
.dlg-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; }
.dlg-body { padding: 16px 20px; overflow-y: auto; flex: 1; min-height: 0; }
dialog > form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-head, .dlg-foot { flex: none; }
dialog.fixed { height: min(640px, calc(100vh - 32px)); }
dialog.fixed > form { height: 100%; max-height: none; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.dlg-foot .spacer { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .err { color: var(--bad); font-size: 12px; }
.with-suffix { display: flex; align-items: center; gap: 6px; }
.with-suffix input, .with-suffix select { flex: 1; }
.with-suffix em { font-style: normal; color: var(--muted); font-size: 13px; white-space: nowrap; }
/* 분류 고르기: 버튼 7개 + 고른 분류가 v2 손익에서 어떻게 쓰이는지 한 줄 */
.cat-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-pick label { cursor: pointer; }
.cat-pick input { position: absolute; opacity: 0; pointer-events: none; }
.cat-pick span { display: inline-block; padding: 5px 12px; border: 1px solid var(--border); border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--muted); }
.cat-pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.cat-pick input:focus-visible + span { outline: 2px solid var(--accent); }
.cat-desc { font-size: 12.5px; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.foot-note { font-size: 12.5px; color: var(--muted); }

/* 반복 지출 관리 */
.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.rec-row:last-child { border-bottom: 0; }
.rec-row strong { font-size: 14px; }
.rec-row .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.col-head { display: flex; align-items: center; gap: 8px; min-height: 30px; margin-bottom: 4px; }
.col-head .spacer { flex: 1; }
/* 이번 달 구독 넣기: 줄마다 체크 + 금액 고치기 */
.add-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 90px 130px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.add-row:last-child { border-bottom: 0; }
.add-row.off { opacity: .5; }
.add-row input[type=number] { width: 100%; }
.add-row .changed { display: block; font-size: 11.5px; color: var(--warn); }

/* 확인 대화상자 (common.html TBD-09) */
.btn.danger-fill { background: var(--bad); border-color: var(--bad); color: #fff; }
.confirm .dlg-head { border-bottom: 0; padding-bottom: 4px; }
.confirm .dlg-body { padding-top: 4px; }
.confirm .dlg-foot { border-top: 0; padding-top: 4px; }
.confirm .lead { margin: 0; }

/* 알림 */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 100; }
.toast[hidden] { display: none; }

@media (max-width: 760px) {
  main { padding: 16px; } .layout { --side-w: 64px; } .layout .label { display: none; } .layout .nav-item, .layout .side-brand { justify-content: center; padding-left: 0; padding-right: 0; } .mock-tag, [data-act="toggle-side"] { display: none; }
  .section-head input[type=search] { width: 100%; }
  .sum-cards, .form-grid, .by-cat-grid { grid-template-columns: 1fr; }
  .due { flex-wrap: wrap; }
}
/* v1.2.0: 관리 창 줄의 수정은 연필 아이콘 (마우스를 올리면 파랑) */
.icon-btn.edit { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; }
.icon-btn.edit svg { width: 16px; height: 16px; }
.icon-btn.edit:hover { color: var(--accent); background: var(--surface-2); }
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-brand"><span class="mark">3D</span><span class="label">3D Farm Farm</span></div>
    <a class="nav-item" href="products.html" title="제품 원가">

      <button class="nav-item" data-act="toggle-side" title="사이드바 접기/펼치기" onclick="toggleSide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span class="label">접기</span></button>

  </aside>
  <main id="view"></main>

<script>

// 반복 지출: 이번 달 결제일이 지났는데 아직 안 넣은 것 (그 반복에서 이번 달에 넣은 줄이 없음)
// 결제일이 그 달 말일보다 크면 말일 (예: 31일 → 2월은 28일)
const lastDayOf = (m) => new Date(Number(m.slice(0, 4)), Number(m.slice(5)), 0).getDate();
const payDate = (r, m) => `${m}-${String(Math.min(r.day, lastDayOf(m))).padStart(2, "0")}`;
const dueThisMonth = () => db.recurring.filter((r) => r.start <= THIS_MONTH && payDate(r, THIS_MONTH) <= TODAY
  && !db.expenses.some((x) => x.recurring === r.id && month(x.date) === THIS_MONTH));

// ---------------------------------------------------------------- 화면
// period: month | year | all | custom
const state = { q: "", cat: "", period: "all", from: "", to: "", sort: { key: "date", dir: "desc" } };
const PERIODS = [["month", "이번 달"], ["year", "올해"], ["all", "전체"], ["custom", "직접 지정"]];
const inPeriod = (x) => ({
  month: () => month(x.date) === THIS_MONTH,
  year: () => x.date.slice(0, 4) === TODAY.slice(0, 4),
  all: () => true,
  custom: () => (!state.from || x.date >= state.from) && (!state.to || x.date <= state.to),
})[state.period]();
const periodLabel = () => (state.period === "custom" ? `${state.from || "처음"} ~ ${state.to || "오늘"}` : PERIODS.find(([k]) => k === state.period)[1]);

// 열 제목 정렬 (TBD-05). 같은 값이면 날짜 최근순
const COLS = [
  { key: "date", label: "날짜", get: (x) => x.date },
  { key: "name", label: "항목", get: (x) => x.name },
  { key: "category", label: "분류", get: (x) => CATS.findIndex((c) => c.key === x.category) },
  { key: "shop", label: "구매처", get: (x) => x.shop || "￿" },
  { key: "amount", label: "금액", get: (x) => x.amount, num: true },
  { key: "note", label: "메모", get: (x) => x.note, nosort: true },
];
function sorter() {
  const c = COLS.find((x) => x.key === state.sort.key), d = state.sort.dir === "asc" ? 1 : -1;
  const cmp = (a, b) => (typeof a === "number" ? a - b : String(a).localeCompare(String(b)));
  return (a, b) => d * cmp(c.get(a), c.get(b)) || b.date.localeCompare(a.date) || b.id - a.id;
}

  const rows = inP.filter((x) => (!state.cat || x.category === state.cat) && (!q || [x.name, x.shop, x.note].join(" ").toLowerCase().includes(q))).sort(sorter());
  const due = dueThisMonth();
  const byCat = CATS.map((c) => ({ ...c, amt: sum(inP.filter((x) => x.category === c.key)) }));
  const maxCat = Math.max(1, ...byCat.map((c) => c.amt));
  const filtered = state.q || state.cat || state.period !== "all";

  $("#view").innerHTML = `
    <h2 class="page-title">지출</h2>

      <div class="spacer"></div>
      <button type="button" class="btn" data-act="recurring">반복 지출 관리</button>
      <button type="button" class="btn primary" data-act="add">+ 지출 추가</button>
    </div>
    <div class="sum-cards">
      <div class="sum-card invest"><span>누적 투자금${help("투자(장비) 분류의 지출 합계 · 전체 기간. v2 에서 투자 회수율의 기준이 돼요")}</span>
        <strong>${won(sum(invest))}</strong><span class="sub">장비 ${invest.length}건</span></div>
      <div class="sum-card"><span>누적 지출${help("모든 분류의 지출 합계 · 전체 기간")}</span>
        <strong>${won(sum(all))}</strong><span class="sub">${all.length}건 · ${all.length ? all.map((x) => x.date).sort()[0].replaceAll("-", ".") : "-"}부터</span></div>
      <div class="sum-card"><span>이번 달 지출${help(`${THIS_MONTH.replace("-", "년 ")}월 · 모든 분류`)}</span>
        <strong>${won(sum(thisMonth))}</strong><span class="sub">${thisMonth.length}건</span></div>
    </div>
    ${due.length ? `<div class="due"><span>결제일이 지난 반복 지출 <b>${due.length}건</b>을 아직 넣지 않았어요 · ${esc(due.map((r) => r.name).join(", "))} (${won(sum(due))})</span><div class="spacer"></div>
      <button type="button" class="btn small primary" data-act="due">확인하고 넣기</button></div>` : ""}
    <div class="by-cat"><div class="by-cat-head"><h4>분류별 합계</h4><span class="hint">${esc(periodLabel())} · 누르면 그 분류만 보기</span></div>
      <div class="by-cat-grid">${byCat.map((c) => `<button type="button" class="cat-row ${c.amt ? "" : "zero"} ${state.cat === c.key ? "active" : ""}" data-cat="${c.key}" title="${esc(c.ex)}">
        <span>${esc(c.label)}</span><span class="bar"><i style="width:${(c.amt / maxCat) * 100}%"></i></span><span class="amt">${c.amt ? won(c.amt) : "-"}</span></button>`).join("")}</div></div>
    <div class="section-head"><h3>지출 목록</h3><span class="hint">${rows.length}건</span><span class="total">${won(sum(rows))}</span><div class="spacer"></div>
      <select id="f-period">${PERIODS.map(([k, l]) => `<option value="${k}" ${k === state.period ? "selected" : ""}>기간: ${l}</option>`).join("")}</select>
      ${state.period === "custom" ? `<span class="range"><input type="date" id="f-from" value="${state.from}" max="${TODAY}" aria-label="시작일">~<input type="date" id="f-to" value="${state.to}" max="${TODAY}" aria-label="종료일"></span>` : ""}
      <select id="f-cat"><option value="">분류: 전체</option>${CATS.map((c) => `<option value="${c.key}" ${state.cat === c.key ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select>
      <input type="search" id="q" placeholder="항목 · 구매처 · 메모 검색" value="${esc(state.q)}">
      ${filtered ? '<button type="button" class="btn small" data-act="clear">필터 지우기</button>' : ""}
      <button type="button" class="btn small" data-act="csv" title="보이는 목록을 엑셀용 CSV 로">CSV 내보내기</button>
    </div>
    <div class="table-wrap">
      ${rows.length ? `<table>
        <thead><tr>${COLS.map(th).join("")}</tr></thead>
        <tbody>${rows.map(row).join("")}</tbody></table>`
      : `<div class="empty">${all.length ? "조건에 맞는 지출이 없어요." : "아직 기록한 지출이 없어요. <b>+ 지출 추가</b> 로 시작하세요."}</div>`}
    </div>`;
  bindView();
}

function th(c) {
  if (c.nosort) return `<th>${c.label}</th>`;
  const on = state.sort.key === c.key;
  return `<th class="sortable ${c.num ? "num" : ""} ${on ? "sorted" : ""}" aria-sort="${on ? (state.sort.dir === "asc" ? "ascending" : "descending") : "none"}"><button type="button" data-sort="${c.key}">${c.label}<span class="arrow">${on && state.sort.dir === "desc" ? "▼" : "▲"}</span></button></th>`;
}

function row(x) {
  return `<tr data-id="${x.id}">
    <td class="date">${x.date.replaceAll("-", ".")}</td>
    <td class="ename">${esc(x.name)}${x.recurring ? '<span class="rec-mark" title="반복 지출에서 넣은 줄">↻ 반복</span>' : ""}${orderLink(x)}</td>
    <td>${catBadge(x.category)}</td>
    <td>${esc(x.shop) || '<span class="muted">-</span>'}</td>
    <td class="num amount">${won(x.amount)}</td>
    <td class="note" title="${esc(x.note)}">${esc(x.note)}</td></tr>`;
}

function bindView() {
  const q = $("#q");
  q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#f-cat").onchange = (e) => { state.cat = e.target.value; render(); };
  $("#f-period").onchange = (e) => { state.period = e.target.value; render(); };
  if ($("#f-from")) { $("#f-from").onchange = (e) => { state.from = e.target.value; render(); }; $("#f-to").onchange = (e) => { state.to = e.target.value; render(); }; }
  $("#view").onclick = (e) => {
    if (e.target.closest(".help, [data-link]")) return;
    const s = e.target.closest("[data-sort]");
    if (s) {
      const k = s.dataset.sort;
      // 처음 누르면 날짜 · 금액은 큰 것부터, 글자는 가나다순
      state.sort = state.sort.key === k ? { key: k, dir: state.sort.dir === "asc" ? "desc" : "asc" } : { key: k, dir: ["date", "amount"].includes(k) ? "desc" : "asc" };
      return render();
    }
    const c = e.target.closest("[data-cat]");
    if (c) { state.cat = state.cat === c.dataset.cat ? "" : c.dataset.cat; return render(); }
    const b = e.target.closest("[data-act]");
    if (b) {
      return ({
        add: () => openExpense(null),
        recurring: () => openRecurring(),
        due: () => openDue(),
        clear: () => { Object.assign(state, { q: "", cat: "", period: "all", from: "", to: "" }); render(); },
        csv: () => toast(`CSV 로 내보냈어요 (목업 · ${$("#view tbody")?.children.length ?? 0}건)`),
      })[b.dataset.act]();
    }
    const tr = e.target.closest("tr[data-id]");
    if (tr) openExpense(byId(db.expenses, tr.dataset.id));
  };
}

const dlg3 = { el: $("#dlg3"), form: $("#dlg3-form") };

function show(dl, html, cls = "") {
  dl.el.className = cls; dl.form.innerHTML = html;
  dl.form.onclick = dl.form.onchange = dl.form.oninput = dl.form.onsubmit = null;
  if (!dl.el.open) dl.el.showModal();
}
const refresh = () => { render(); if (dlg.el.open && $("#dlg .rec-list")) openRecurring(); };
// 확인 대화상자 (common.html TBD-09) — 그것만 지워지는 삭제라 한 번 확인
function confirmBox(o) {
  const d = nextDlg();
  show(d, `<div class="dlg-head">${esc(o.title)}</div><div class="dlg-body"><p class="lead">${o.lead}</p></div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>취소</button>
      <button type="button" class="btn danger-fill" data-ok>${esc(o.okLabel || "삭제")}</button></div>`, "narrow confirm");
  d.form.querySelector("[data-close]").focus();
  d.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return d.el.close();
    if (e.target.closest("[data-ok]")) { d.el.close(); o.onOk?.(); }
  };
}
const shopOptions = () => { $("#shops").innerHTML = [...new Set(db.expenses.map((x) => x.shop).filter(Boolean))].sort().map((s) => `<option value="${esc(s)}">`).join(""); };
const catPick = (sel) => `<div class="cat-pick" role="radiogroup" aria-label="분류">${CATS.map((c) => `<label title="${esc(c.ex)}"><input type="radio" name="category" value="${c.key}" ${c.key === sel ? "checked" : ""} required><span>${esc(c.label)}</span></label>`).join("")}</div>`;
const catDesc = (k) => (k ? `<b>${esc(cat(k).label)}</b> · 예: ${esc(cat(k).ex)}<br>${esc(cat(k).v2)}` : "분류를 고르세요. 고른 분류에 따라 v2 손익에서 다르게 계산돼요.");

// ---------------------------------------------------------------- 지출 추가 / 복제 / 수정 (EXP-02)
// preset.copyOf: 복제할 원본 (날짜는 오늘, 반복 지출 연결은 복사하지 않음)
function openExpense(x, preset = {}) {
  const src = preset.copyOf;
  const init = x ?? (src ? { ...src, date: TODAY, recurring: undefined } : { date: TODAY, category: "", amount: null, name: "", shop: "", url: "", note: "" });
  const rec = x?.recurring ? byId(db.recurring, x.recurring) : null;
  shopOptions();
  show(dlg, `<div class="dlg-head">${x ? "지출 수정" : "지출 추가"}${x ? (rec ? `<span class="badge info">↻ 반복 지출 · ${esc(rec.name)}</span>` : "") : src ? `<span class="hint" style="font-weight:400">${esc(src.name)}에서 복제</span>` : ""}</div>
    <div class="dlg-body"><div class="form-grid">
      <label class="field"><span>날짜 *</span><input type="date" name="date" required value="${init.date}" max="${TODAY}"></label>
      <label class="field"><span>금액 *</span><div class="with-suffix"><input type="number" name="amount" required min="1" step="1" value="${init.amount ?? ""}" placeholder="0"><em>원</em></div></label>
      <label class="field full"><span>항목 *</span><input name="name" required ${x ? "" : "autofocus"} value="${esc(init.name)}" placeholder="예: 필라멘트 건조기"></label>
      <div class="field full"><span>분류 *</span>${catPick(init.category)}<div class="cat-desc" id="cat-desc">${catDesc(init.category)}</div></div>
      <label class="field"><span>구매처</span><input name="shop" list="shops" value="${esc(init.shop)}" placeholder="예: 쿠팡"></label>
      <label class="field"><span>주문 링크</span><input name="url" type="url" value="${esc(init.url)}" placeholder="https://… 주문 내역 · 영수증"><span class="err" id="url-err" hidden>https:// 로 시작하는 주소로 입력하세요</span></label>
      <label class="field full"><span>메모</span><textarea name="note" rows="2" placeholder="예: 배송비 포함 · 할부 3개월">${esc(init.note)}</textarea></label>
    </div></div>
    <div class="dlg-foot">
      ${x ? '<button type="button" class="btn danger" data-del>삭제</button><button type="button" class="btn" data-copy>복제</button>' : ""}
      <div class="spacer"></div>
      <button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">저장</button></div>`);
  const form = dlg.form;
  const urlOk = (v) => !v || /^https?:\/\/\S+\.\S+/.test(v);
  form.oninput = (e) => {
    if (e.target.name === "category") $("#cat-desc").innerHTML = catDesc(e.target.value);
    if (e.target.name === "url") $("#url-err").hidden = urlOk(e.target.value.trim());
  };
  form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return dlg.el.close();
    if (e.target.closest("[data-copy]")) return openExpense(null, { copyOf: x });
    if (e.target.closest("[data-del]")) {
      confirmBox({ title: "지출 삭제", lead: `<b>${esc(x.name)}</b> (${x.date.replaceAll("-", ".")} · ${won(x.amount)}) 을(를) 삭제할까요?`,
        onOk: () => { db.expenses = db.expenses.filter((y) => y !== x); dlg.el.close(); refresh(); toast("삭제했어요"); } });
    }
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const d = { date: fd.get("date"), name: fd.get("name").trim(), category: fd.get("category"), amount: Math.round(Number(fd.get("amount"))),
      shop: fd.get("shop").trim(), url: fd.get("url").trim(), note: fd.get("note").trim() };
    if (!d.category) return toast("분류를 고르세요");
    if (!urlOk(d.url)) return toast("주문 링크 주소를 확인하세요");
    if (x) Object.assign(x, d); else db.expenses.push({ ...d, id: nextId(db.expenses) });
    dlg.el.close(); refresh(); toast("저장했어요");
  };
}

// ---------------------------------------------------------------- 반복 지출 관리 (EXP-04)
const ym = (m) => m.replace("-", ".");
function openRecurring() {
  const list = [...db.recurring].sort((a, b) => a.day - b.day);
  const recRow = (r) => {
    const n = db.expenses.filter((x) => x.recurring === r.id).length;
    return `<div class="rec-row"><div><strong>${esc(r.name)}</strong> ${catBadge(r.category)}
        <div class="hint">매달 ${r.day}일 · ${ym(r.start)}부터 · 넣은 지출 ${n}건</div></div>
      <span class="amt">${won(r.amount)}</span>
      <button type="button" class="icon-btn edit" data-edit="${r.id}" title="수정" aria-label="수정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>`;
  };
  const active = db.recurring;
  show(dlg, `<div class="dlg-head">반복 지출 관리</div><div class="dlg-body rec-list">
      <div class="col-head"><h4>반복 지출</h4>${help("매달 같은 금액이 나가는 것(구독 · 월정액). 등록해 두면 결제일이 지난 달마다 '확인하고 넣기'로 지출 목록에 들어가요. 저절로 넣지는 않아요. 그만 낼 때는 삭제하세요 — 이미 넣은 지출은 목록에 그대로 남아요. 다시 내게 되면 새로 등록하면 돼요.").replace('class="help"', 'class="help down"')}<span class="hint">${active.length}개 · 매달 ${won(sum(active))}</span><div class="spacer"></div><button type="button" class="btn small add" data-add>+ 반복 지출 추가</button></div>
      ${list.map(recRow).join("") || '<p class="hint">등록된 반복 지출이 없어요.</p>'}</div>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>닫기</button></div>`, "wide fixed");
  dlg.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return dlg.el.close();
    if (e.target.closest("[data-add]")) return openRecurringForm(null);
    const ed = e.target.closest("[data-edit]"); if (ed) return openRecurringForm(byId(db.recurring, ed.dataset.edit));
  };
}

function openRecurringForm(r) {
  const init = r ?? { name: "", category: "sub", amount: null, day: 1, start: THIS_MONTH, shop: "", note: "" };
  show(dlg2, `<div class="dlg-head">${r ? "반복 지출 수정" : "반복 지출 추가"}</div><div class="dlg-body"><div class="form-grid">
      <label class="field full"><span>이름 *</span><input name="name" required value="${esc(init.name)}" placeholder="예: AI 구독"></label>
      <label class="field"><span>금액 *</span><div class="with-suffix"><input type="number" name="amount" required min="1" step="1" value="${init.amount ?? ""}"><em>원</em></div></label>
      <label class="field"><span>결제일 *</span><div class="with-suffix"><em>매달</em><input type="number" name="day" required min="1" max="31" value="${init.day}"><em>일</em></div></label>
      <div class="field full"><span>분류 *</span>${catPick(init.category)}</div>
      <label class="field"><span>시작 달 *</span><input type="month" name="start" required value="${init.start}"></label>
      <label class="field"><span>메모</span><input name="note" value="${esc(init.note)}"></label>
    </div>${r ? '<p class="hint" style="margin:12px 0 0">금액을 바꾸면 다음에 넣는 달부터 바뀐 금액으로 들어가요. 이미 넣은 지출은 그대로예요.</p>' : ""}</div>
    <div class="dlg-foot">${r ? '<button type="button" class="btn danger" data-del>삭제</button>' : ""}<div class="spacer"></div><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">저장</button></div>`);
  // 그만 낼 때는 삭제 (수정 창 왼쪽 아래). 이미 넣은 지출은 남는다
  dlg2.form.onclick = (e) => {
    if (e.target.closest("[data-close]")) return dlg2.el.close();
    if (!e.target.closest("[data-del]")) return;
    const n = db.expenses.filter((x) => x.recurring === r.id).length;
    confirmBox({ title: "반복 지출 삭제", lead: `<b>${esc(r.name)}</b> 을(를) 삭제할까요?<br><span class="hint">다음 달부터 알림이 뜨지 않아요.${n ? ` 이미 넣은 지출 ${n}건은 목록에 그대로 남아요.` : ""}</span>`,
      onOk: () => { db.recurring = db.recurring.filter((y) => y !== r); db.expenses.forEach((x) => { if (x.recurring === r.id) delete x.recurring; }); dlg2.el.close(); refresh(); toast("삭제했어요"); } });
  };
  dlg2.form.onsubmit = (e) => {
    e.preventDefault(); const fd = new FormData(dlg2.form);
    const d = { name: fd.get("name").trim(), category: fd.get("category"), amount: Math.round(Number(fd.get("amount"))), day: Number(fd.get("day")),
      start: fd.get("start"), note: fd.get("note").trim(), shop: "" };
    if (r) Object.assign(r, d); else db.recurring.push({ ...d, id: nextId(db.recurring) });
    dlg2.el.close(); refresh(); toast("저장했어요");
  };
}

// ---------------------------------------------------------------- 이번 달 반복 지출 넣기
// 줄마다 체크 · 금액 고치기 (이번 달만 다른 금액이면 여기서). 날짜 = 이번 달 결제일 (말일보다 크면 말일)
function openDue() {
  const due = dueThisMonth();
  const off = new Set(), amt = Object.fromEntries(due.map((r) => [r.id, r.amount]));
  const dateOf = (r) => payDate(r, THIS_MONTH);
  const draw = () => {
    const picked = due.filter((r) => !off.has(r.id));
    show(dlg, `<div class="dlg-head">이번 달 반복 지출 넣기<span class="hint" style="font-weight:400">${THIS_MONTH.replace("-", "년 ")}월</span></div><div class="dlg-body">
        <p class="hint" style="margin:0 0 8px">넣을 것만 체크하세요. 이번 달 금액이 다르면 고쳐서 넣어요 (반복 지출 금액은 그대로).</p>
        ${due.map((r) => `<label class="add-row ${off.has(r.id) ? "off" : ""}"><input type="checkbox" data-rid="${r.id}" ${off.has(r.id) ? "" : "checked"}>
          <span><b>${esc(r.name)}</b> ${catBadge(r.category)}<span class="hint" style="display:block">${dateOf(r).replaceAll("-", ".")}</span></span>
          <span class="hint num">평소 ${won(r.amount)}</span>
          <span><span class="with-suffix"><input type="number" min="1" step="1" data-amt="${r.id}" value="${amt[r.id]}"><em>원</em></span>${amt[r.id] !== r.amount ? '<span class="changed">이번 달만 다른 금액</span>' : ""}</span></label>`).join("")}</div>
      <div class="dlg-foot"><span class="foot-note">${picked.length}건 · ${won(picked.reduce((a, r) => a + amt[r.id], 0))}</span><div class="spacer"></div>
        <button type="button" class="btn" data-close>취소</button><button type="button" class="btn primary" data-go ${picked.length ? "" : "disabled"}>${picked.length}건 넣기</button></div>`, "wide");
    dlg.form.onchange = (e) => {
      if (e.target.dataset.rid) { const id = Number(e.target.dataset.rid); e.target.checked ? off.delete(id) : off.add(id); draw(); }
      if (e.target.dataset.amt) { amt[e.target.dataset.amt] = Math.max(1, Math.round(Number(e.target.value)) || 1); draw(); }
    };
    dlg.form.onclick = (e) => {
      if (e.target.closest("[data-close]")) return dlg.el.close();
      if (!e.target.closest("[data-go]")) return;
      picked.forEach((r) => db.expenses.push({ id: nextId(db.expenses), date: dateOf(r), name: r.name, category: r.category, amount: amt[r.id], shop: r.shop, url: "", note: "", recurring: r.id }));
      dlg.el.close(); render(); toast(`반복 지출 ${picked.length}건을 넣었어요`);
    };
  };
  draw();
}

// ---------------------------------------------------------------- 시작
const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function toggleSide(force) {
  const el = $("#layout");
  const collapsed = force ?? !el.classList.contains("collapsed");
  el.classList.toggle("collapsed", collapsed);
  $("[data-act='toggle-side'] .label").textContent = collapsed ? "펼치기" : "접기";
  try { localStorage.setItem("pff-side-collapsed", collapsed ? "1" : "0"); } catch { /* 저장 불가 */ }
}
let savedSide = null;
try { savedSide = localStorage.getItem("pff-side-collapsed"); } catch { /* 저장 불가 */ }
if (params.get("side") === "collapsed" || savedSide === "1") toggleSide(true);
render();
({
  expense: () => openExpense(db.expenses[0]),
  "expense-new": () => openExpense(null),
  recurring: () => openRecurring(),
  "recurring-add": () => { openRecurring(); openRecurringForm(null); },
  due: () => openDue(),
})[params.get("open")]?.();
</script>
</body>
</html>
